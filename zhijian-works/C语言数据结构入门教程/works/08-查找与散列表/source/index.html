<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:"><title>08｜查找与散列表</title><style>
:root{--green:#4a6741;--green2:#6b8e63;--rust:#a0522d;--ink:#332b25;--muted:#6b5d4d;--paper:#faf8f5;--cream:#f1ece4;--line:#c4a77d;--white:#fff;--accent:#8B7355;--shadow:0 12px 34px #3d322918;--r:18px;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-family:"Noto Serif SC","Songti SC",serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(90deg,#c4a77d12 1px,transparent 1px),var(--paper);background-size:32px 32px;line-height:1.65}button,input,select{font:inherit}button{min-height:44px}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.eyebrow{margin:0 0 8px;color:var(--accent);font:800 12px/1.2 system-ui;letter-spacing:.14em;text-transform:uppercase}h2,h3{color:var(--green);line-height:1.25}h2{font-size:clamp(1.55rem,4vw,2.35rem);margin:0 0 14px}h3{margin:0 0 8px}.btn{border:1px solid var(--line);border-radius:10px;padding:8px 15px;background:var(--white);color:var(--ink);cursor:pointer;font-weight:800}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn[aria-pressed=true],.btn:hover{box-shadow:0 5px 14px #3d322922;transform:translateY(-1px)}.note{padding:14px 16px;border-left:4px solid var(--accent);background:var(--cream);border-radius:0 12px 12px 0}.code{margin:0;padding:16px;background:#292825;color:#f8f3ea;border-radius:14px;overflow:auto;font:14px/1.7 var(--mono)}.code span{display:block;padding:0 8px;border-radius:4px;white-space:pre}.code .active{background:#a0522d55;color:#fff3c4}.quiz{display:grid;gap:12px}.q{padding:16px;border-radius:14px;background:var(--paper)}.q p{margin-top:0;font-weight:800}.options{display:flex;flex-wrap:wrap;gap:8px}.feedback{min-height:24px;margin-top:8px;color:var(--green);font-weight:800}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

body{min-height:100vh;padding:20px}.shell{width:min(1240px,100%);min-height:calc(100vh - 40px);margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}.stage,.panel{border:1px solid #c4a77d66;border-radius:var(--r);background:var(--white);box-shadow:var(--shadow)}.stage{display:grid;grid-template-rows:auto minmax(220px,1fr) auto;overflow:hidden}.stage-head{padding:20px 22px 0}.stage-head p{margin:0}.visual{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:22px;min-height:230px;background:radial-gradient(circle at 20% 20%,#c4a77d22,transparent 38%),var(--paper)}.node{position:relative;min-width:88px;min-height:70px;display:grid;place-items:center;padding:9px;border:2px solid var(--line);border-radius:14px;background:var(--white);font:800 15px/1.3 var(--mono);text-align:center;white-space:pre-line}.node:not(:last-child):after{content:'→';position:absolute;right:-15px;color:var(--accent);font:900 18px system-ui;z-index:2}.node.active{border-color:var(--accent);background:#a0522d18;transform:translateY(-4px)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--cream)}.metric{padding:14px 18px;border-right:1px solid var(--cream)}.metric:last-child{border-right:0}.metric span{display:block;color:var(--muted);font:700 12px system-ui}.metric strong{color:var(--green);font-size:1.15rem}.panel{padding:20px;display:grid;gap:14px;align-content:start}.panel h2{font-size:1.4rem}.control{display:grid;gap:5px}.control label{font-weight:800;color:var(--muted)}select,input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--white);color:var(--ink)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .primary{grid-column:1/-1}.status{min-height:70px;margin:0}.quiz-wrap{border-top:1px solid var(--cream);padding-top:12px}.quiz-wrap summary{cursor:pointer;color:var(--green);font-weight:900}.quiz{margin-top:10px}.q{padding:10px}.q p{font-size:.9rem}.q .btn{min-height:38px;padding:6px 9px;font-size:.85rem}@media(max-width:880px){body{padding:12px}.shell{grid-template-columns:1fr}.stage{min-height:600px}.panel{order:-1}.metrics{grid-template-columns:1fr}.metric{border-right:0;border-bottom:1px solid var(--cream)}}@media(max-width:480px){.visual{padding:16px}.node{min-width:72px}.actions{grid-template-columns:1fr}.actions .primary{grid-column:auto}}
</style></head><body><main class="shell"><section class="stage" aria-label="查找与散列表动态演示"><header class="stage-head"><p class="eyebrow">08 · 单步实验</p><h2 id="scenarioTitle">查找与散列表</h2><p>观察数据状态、当前 C 代码行与操作代价如何同步变化。</p></header><div class="visual" id="visual" aria-live="polite"></div><div class="metrics"><div class="metric"><span>当前步骤</span><strong id="stepMetric">0 / 0</strong></div><div class="metric"><span>操作计数</span><strong id="countMetric">0</strong></div><div class="metric"><span>复杂度</span><strong id="complexity">—</strong></div></div></section><aside class="panel" aria-label="实验控制台"><div><p class="eyebrow">观察控制台</p><h2>选择操作并逐步执行</h2></div><div class="control"><label for="scenario">实验场景</label><select id="scenario"><option value="0">二分查找命中</option><option value="1">二分查找失败</option><option value="2">哈希线性探测冲突</option><option value="3">重复键更新</option></select></div><div class="control"><label for="custom">示例整数（−99 到 99）</label><input id="custom" type="number" min="-99" max="99" value="42" inputmode="numeric" aria-describedby="error"><span id="error" role="alert"></span></div><div class="actions"><button class="btn primary" id="next">下一步</button><button class="btn" id="play">播放</button><button class="btn" id="reset">重置</button></div><p class="note status" id="status" role="status">选择场景，然后开始单步观察。</p><pre class="code" id="code" aria-label="C11 核心代码"></pre><details class="quiz-wrap"><summary>完成三道自测</summary><div class="quiz" id="quiz"><div class="q" data-answer="a"><p>1. 二分查找的必要前提？</p><div class="options"><button class="btn" data-choice="a">数据有序且可随机访问</button><button class="btn" data-choice="b">数据必须无重复</button></div><div class="feedback" aria-live="polite"></div></div><div class="q" data-answer="a"><p>2. 哈希冲突表示？</p><div class="options"><button class="btn" data-choice="a">不同键映射到同一位置</button><button class="btn" data-choice="b">内存一定损坏</button></div><div class="feedback" aria-live="polite"></div></div><div class="q" data-answer="a"><p>3. 装载因子过高通常会？</p><div class="options"><button class="btn" data-choice="a">增加冲突与探测长度</button><button class="btn" data-choice="b">保证 O(1)</button></div><div class="feedback" aria-live="polite"></div></div></div></details></aside></main><script>const scenarios=[{"name": "二分查找命中", "complexity": "O(log n)", "code": ["int lo = 0, hi = n - 1;", "while (lo <= hi) {", "  int mid = lo + (hi - lo) / 2;", "  if (a[mid] == key) return mid;", "  if (a[mid] < key) lo = mid + 1; else hi = mid - 1;", "}", "return -1;"], "frames": [["3", "8", "12", "19", "27", "31", "42"], ["lo=0 hi=6", "mid=3 值19", "目标 27 更大", "舍弃左半"], ["lo=4 hi=6", "mid=5 值31", "目标更小", "舍弃右半"], ["lo=4 hi=4", "mid=4 值27", "命中下标4", "完成"]], "notes": ["二分前提：数组已有序且支持随机访问。", "比较中点缩小区间。", "再次折半。", "找到目标。"]}, {"name": "二分查找失败", "complexity": "O(log n)", "code": ["while (lo <= hi) {", "  int mid = lo + (hi - lo) / 2;", "  if (a[mid] < key) lo = mid + 1;", "  else hi = mid - 1;", "}", "return -1;"], "frames": [["3", "8", "12", "19", "27", "31"], ["查 25", "mid=2 值12", "lo=3", "右半"], ["mid=4 值27", "hi=3", "左半"], ["lo=3 hi=3 值19", "lo=4", "区间空"], ["返回 -1", "查找失败", "没有越界", "完成"]], "notes": ["失败也从完整区间开始。", "目标更大。", "目标小于 27。", "最后候选也不匹配。", "lo>hi 表示区间为空。"]}, {"name": "哈希线性探测冲突", "complexity": "平均 O(1)，最坏 O(n)", "code": ["int i = hash(key) % CAPACITY;", "while (table[i].used && table[i].key != key)", "  i = (i + 1) % CAPACITY;", "table[i] = (Entry){key, true};"], "frames": [["容量 7", "10 在槽3", "17 待插", "hash=3"], ["槽3 已占", "发生冲突", "比较键不同", "向后探测"], ["槽4 空", "写入 17", "used=true", "完成"], ["装载因子 2/7", "冲突可控", "平均接近 O(1)", "仍需扩容策略"]], "notes": ["不同键可能映射到同一槽。", "线性探测寻找下一位置。", "空槽接受新键。", "装载因子升高会增加冲突。"]}, {"name": "重复键更新", "complexity": "平均 O(1)", "code": ["while (table[i].used) {", "  if (table[i].key == key) { table[i].value = value; return; }", "  i = (i + 1) % CAPACITY;", "}"], "frames": [["键 17→值4", "新值 {value}", "hash=3", "开始探测"], ["槽3 是键10", "继续", "槽4 是键17", "命中"], ["更新值为 {value}", "不新增槽", "元素数不变", "完成"]], "notes": ["插入前也要检测重复键。", "沿探测序列找到已有键。", "更新而不是制造重复记录。"]}];let step=-1,timer=null,count=0;const scenario=document.querySelector('#scenario'),custom=document.querySelector('#custom'),visual=document.querySelector('#visual'),status=document.querySelector('#status'),code=document.querySelector('#code'),play=document.querySelector('#play');function selected(){return scenarios[Number(scenario.value)]}function value(){const n=Number(custom.value);if(!Number.isInteger(n)||n<-99||n>99){error.textContent='请输入 −99 到 99 之间的整数。';return null}error.textContent='';return n}function format(x,n){return String(x).replaceAll('{value}',String(n))}function stop(){if(timer)clearInterval(timer);timer=null;play.textContent='播放';play.setAttribute('aria-pressed','false')}function render(){const s=selected(),n=value();scenarioTitle.textContent=s.name;complexity.textContent=s.complexity;code.innerHTML=s.code.map((x,i)=>`<span class="${i===Math.min(step,s.code.length-1)?'active':''}">${format(x,n??42)}</span>`).join('');if(step<0){visual.innerHTML='<div class="node">准备开始</div>';stepMetric.textContent=`0 / ${s.frames.length}`;countMetric.textContent='0';status.textContent='选择场景，然后点击“下一步”或“播放”。';return}const f=s.frames[step];visual.innerHTML=f.map((x,i)=>`<div class="node ${i===step%f.length?'active':''}">${format(x,n)}</div>`).join('');stepMetric.textContent=`${step+1} / ${s.frames.length}`;countMetric.textContent=String(count);status.textContent=s.notes[step]||'继续观察。';}function advance(){if(value()===null){stop();return}const s=selected();if(step>=s.frames.length-1){stop();status.textContent='实验已完成；可重置或切换场景。';return}step++;count++;render();}next.onclick=advance;play.onclick=()=>{if(timer){stop();status.textContent='已暂停，可继续单步观察。';return}if(value()===null)return;play.textContent='暂停';play.setAttribute('aria-pressed','true');timer=setInterval(advance,900);advance()};reset.onclick=()=>{stop();step=-1;count=0;render()};scenario.onchange=()=>{stop();step=-1;count=0;render()};custom.oninput=()=>{if(step>=0)render();else value()};quiz.addEventListener('click',e=>{const b=e.target.closest('[data-choice]');if(!b)return;const q=b.closest('.q'),ok=b.dataset.choice===q.dataset.answer;q.querySelector('.feedback').textContent=ok?'回答正确。':'再想一想：回到上面的图和代码寻找依据。';q.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))});render();</script></body></html>
