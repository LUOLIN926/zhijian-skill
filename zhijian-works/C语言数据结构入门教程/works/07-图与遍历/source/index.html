<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:"><title>07｜图与遍历</title><style>
:root{--green:#4a6741;--green2:#6b8e63;--rust:#a0522d;--ink:#332b25;--muted:#6b5d4d;--paper:#faf8f5;--cream:#f1ece4;--line:#c4a77d;--white:#fff;--accent:#7A8F6A;--shadow:0 12px 34px #3d322918;--r:18px;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-family:"Noto Serif SC","Songti SC",serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(90deg,#c4a77d12 1px,transparent 1px),var(--paper);background-size:32px 32px;line-height:1.65}button,input,select{font:inherit}button{min-height:44px}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.eyebrow{margin:0 0 8px;color:var(--accent);font:800 12px/1.2 system-ui;letter-spacing:.14em;text-transform:uppercase}h2,h3{color:var(--green);line-height:1.25}h2{font-size:clamp(1.55rem,4vw,2.35rem);margin:0 0 14px}h3{margin:0 0 8px}.btn{border:1px solid var(--line);border-radius:10px;padding:8px 15px;background:var(--white);color:var(--ink);cursor:pointer;font-weight:800}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn[aria-pressed=true],.btn:hover{box-shadow:0 5px 14px #3d322922;transform:translateY(-1px)}.note{padding:14px 16px;border-left:4px solid var(--accent);background:var(--cream);border-radius:0 12px 12px 0}.code{margin:0;padding:16px;background:#292825;color:#f8f3ea;border-radius:14px;overflow:auto;font:14px/1.7 var(--mono)}.code span{display:block;padding:0 8px;border-radius:4px;white-space:pre}.code .active{background:#a0522d55;color:#fff3c4}.quiz{display:grid;gap:12px}.q{padding:16px;border-radius:14px;background:var(--paper)}.q p{margin-top:0;font-weight:800}.options{display:flex;flex-wrap:wrap;gap:8px}.feedback{min-height:24px;margin-top:8px;color:var(--green);font-weight:800}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

body{min-height:100vh;padding:20px}.shell{width:min(1240px,100%);min-height:calc(100vh - 40px);margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}.stage,.panel{border:1px solid #c4a77d66;border-radius:var(--r);background:var(--white);box-shadow:var(--shadow)}.stage{display:grid;grid-template-rows:auto minmax(220px,1fr) auto;overflow:hidden}.stage-head{padding:20px 22px 0}.stage-head p{margin:0}.visual{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:22px;min-height:230px;background:radial-gradient(circle at 20% 20%,#c4a77d22,transparent 38%),var(--paper)}.node{position:relative;min-width:88px;min-height:70px;display:grid;place-items:center;padding:9px;border:2px solid var(--line);border-radius:14px;background:var(--white);font:800 15px/1.3 var(--mono);text-align:center;white-space:pre-line}.node:not(:last-child):after{content:'→';position:absolute;right:-15px;color:var(--accent);font:900 18px system-ui;z-index:2}.node.active{border-color:var(--accent);background:#a0522d18;transform:translateY(-4px)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--cream)}.metric{padding:14px 18px;border-right:1px solid var(--cream)}.metric:last-child{border-right:0}.metric span{display:block;color:var(--muted);font:700 12px system-ui}.metric strong{color:var(--green);font-size:1.15rem}.panel{padding:20px;display:grid;gap:14px;align-content:start}.panel h2{font-size:1.4rem}.control{display:grid;gap:5px}.control label{font-weight:800;color:var(--muted)}select,input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--white);color:var(--ink)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .primary{grid-column:1/-1}.status{min-height:70px;margin:0}.quiz-wrap{border-top:1px solid var(--cream);padding-top:12px}.quiz-wrap summary{cursor:pointer;color:var(--green);font-weight:900}.quiz{margin-top:10px}.q{padding:10px}.q p{font-size:.9rem}.q .btn{min-height:38px;padding:6px 9px;font-size:.85rem}@media(max-width:880px){body{padding:12px}.shell{grid-template-columns:1fr}.stage{min-height:600px}.panel{order:-1}.metrics{grid-template-columns:1fr}.metric{border-right:0;border-bottom:1px solid var(--cream)}}@media(max-width:480px){.visual{padding:16px}.node{min-width:72px}.actions{grid-template-columns:1fr}.actions .primary{grid-column:auto}}
</style></head><body><main class="shell"><section class="stage" aria-label="图与遍历动态演示"><header class="stage-head"><p class="eyebrow">07 · 单步实验</p><h2 id="scenarioTitle">图与遍历</h2><p>观察数据状态、当前 C 代码行与操作代价如何同步变化。</p></header><div class="visual" id="visual" aria-live="polite"></div><div class="metrics"><div class="metric"><span>当前步骤</span><strong id="stepMetric">0 / 0</strong></div><div class="metric"><span>操作计数</span><strong id="countMetric">0</strong></div><div class="metric"><span>复杂度</span><strong id="complexity">—</strong></div></div></section><aside class="panel" aria-label="实验控制台"><div><p class="eyebrow">观察控制台</p><h2>选择操作并逐步执行</h2></div><div class="control"><label for="scenario">实验场景</label><select id="scenario"><option value="0">广度优先 BFS</option><option value="1">深度优先 DFS</option><option value="2">断开图完整遍历</option><option value="3">有环图避免重复</option></select></div><div class="control"><label for="custom">示例整数（−99 到 99）</label><input id="custom" type="number" min="-99" max="99" value="42" inputmode="numeric" aria-describedby="error"><span id="error" role="alert"></span></div><div class="actions"><button class="btn primary" id="next">下一步</button><button class="btn" id="play">播放</button><button class="btn" id="reset">重置</button></div><p class="note status" id="status" role="status">选择场景，然后开始单步观察。</p><pre class="code" id="code" aria-label="C11 核心代码"></pre><details class="quiz-wrap"><summary>完成三道自测</summary><div class="quiz" id="quiz"><div class="q" data-answer="a"><p>1. BFS 的核心辅助结构？</p><div class="options"><button class="btn" data-choice="a">队列</button><button class="btn" data-choice="b">栈</button></div><div class="feedback" aria-live="polite"></div></div><div class="q" data-answer="a"><p>2. DFS 递归隐含使用？</p><div class="options"><button class="btn" data-choice="a">调用栈</button><button class="btn" data-choice="b">散列表</button></div><div class="feedback" aria-live="polite"></div></div><div class="q" data-answer="a"><p>3. 只从一个起点能遍历断开图全部顶点吗？</p><div class="options"><button class="btn" data-choice="a">不能，需要外层扫描</button><button class="btn" data-choice="b">一定能</button></div><div class="feedback" aria-live="polite"></div></div></div></details></aside></main><script>const scenarios=[{"name": "广度优先 BFS", "complexity": "O(V+E)", "code": ["visited[start] = true;", "enqueue(&q, start);", "while (!empty(&q)) {", "  int v = dequeue(&q);", "  for each neighbor w of v", "    if (!visited[w]) { visited[w]=true; enqueue(&q,w); }", "}"], "frames": [["图 A-B,A-C", "B-D,C-E", "队列空", "均未访问"], ["访问 A", "队列 [A]", "标记 A", "起点"], ["取 A", "发现 B,C", "队列 [B,C]", "标记 B,C"], ["取 B", "发现 D", "队列 [C,D]", "标记 D"], ["取 C", "发现 E", "队列 [D,E]", "标记 E"], ["顺序 A,B,C,D,E", "队列清空", "遍历完成", "按层扩展"]], "notes": ["准备访问标记和队列。", "起点入队时就标记，避免重复入队。", "扩展 A 的邻居。", "继续处理队首。", "处理同层另一个节点。", "所有可达节点已访问。"]}, {"name": "深度优先 DFS", "complexity": "O(V+E)", "code": ["void dfs(int v) {", "  visited[v] = true;", "  for each neighbor w of v", "    if (!visited[w]) dfs(w);", "}"], "frames": [["A-B,A-C", "B-D,C-E", "递归栈空", "均未访问"], ["进入 A", "栈 [A]", "标记 A", "选 B"], ["进入 B", "栈 [A,B]", "标记 B", "选 D"], ["进入 D", "栈 [A,B,D]", "无新邻居", "回退"], ["回到 A 再进 C,E", "顺序 A,B,D,C,E", "遍历完成", "深度优先"]], "notes": ["DFS 可用递归或显式栈。", "先标记再深入。", "沿一条路径继续。", "走到底后回溯。", "再探索未访问分支。"]}, {"name": "断开图完整遍历", "complexity": "O(V+E)", "code": ["for (int v = 0; v < vertex_count; ++v)", "  if (!visited[v]) dfs(v);"], "frames": [["分量 A-B-C", "分量 D-E", "F 孤立", "均未访问"], ["从 A 启动", "访问 A,B,C", "第一分量完成", "D,E,F 未访问"], ["扫描到 D", "访问 D,E", "第二分量完成", "F 未访问"], ["扫描到 F", "访问 F", "三个分量", "全部完成"]], "notes": ["从单一起点只能覆盖可达部分。", "完成第一个连通分量。", "外层循环启动新遍历。", "孤立点也必须访问。"]}, {"name": "有环图避免重复", "complexity": "O(V+E)", "code": ["if (!visited[w]) {", "  visited[w] = true;", "  enqueue(&q, w);", "}"], "frames": [["A-B-C-A", "存在环", "visited 全 false", "队列空"], ["访问 A", "标记 A", "B,C 入队", "立即标记"], ["从 B 看见 C", "C 已标记", "不重复入队", "环被截断"], ["队列清空", "A,B,C 各一次", "遍历结束", "不会死循环"]], "notes": ["环会把路径带回旧节点。", "入队时标记最稳妥。", "检查 visited 阻止重复。", "每个顶点只处理一次。"]}];let step=-1,timer=null,count=0;const scenario=document.querySelector('#scenario'),custom=document.querySelector('#custom'),visual=document.querySelector('#visual'),status=document.querySelector('#status'),code=document.querySelector('#code'),play=document.querySelector('#play');function selected(){return scenarios[Number(scenario.value)]}function value(){const n=Number(custom.value);if(!Number.isInteger(n)||n<-99||n>99){error.textContent='请输入 −99 到 99 之间的整数。';return null}error.textContent='';return n}function format(x,n){return String(x).replaceAll('{value}',String(n))}function stop(){if(timer)clearInterval(timer);timer=null;play.textContent='播放';play.setAttribute('aria-pressed','false')}function render(){const s=selected(),n=value();scenarioTitle.textContent=s.name;complexity.textContent=s.complexity;code.innerHTML=s.code.map((x,i)=>`<span class="${i===Math.min(step,s.code.length-1)?'active':''}">${format(x,n??42)}</span>`).join('');if(step<0){visual.innerHTML='<div class="node">准备开始</div>';stepMetric.textContent=`0 / ${s.frames.length}`;countMetric.textContent='0';status.textContent='选择场景，然后点击“下一步”或“播放”。';return}const f=s.frames[step];visual.innerHTML=f.map((x,i)=>`<div class="node ${i===step%f.length?'active':''}">${format(x,n)}</div>`).join('');stepMetric.textContent=`${step+1} / ${s.frames.length}`;countMetric.textContent=String(count);status.textContent=s.notes[step]||'继续观察。';}function advance(){if(value()===null){stop();return}const s=selected();if(step>=s.frames.length-1){stop();status.textContent='实验已完成；可重置或切换场景。';return}step++;count++;render();}next.onclick=advance;play.onclick=()=>{if(timer){stop();status.textContent='已暂停，可继续单步观察。';return}if(value()===null)return;play.textContent='暂停';play.setAttribute('aria-pressed','true');timer=setInterval(advance,900);advance()};reset.onclick=()=>{stop();step=-1;count=0;render()};scenario.onchange=()=>{stop();step=-1;count=0;render()};custom.oninput=()=>{if(step>=0)render();else value()};quiz.addEventListener('click',e=>{const b=e.target.closest('[data-choice]');if(!b)return;const q=b.closest('.q'),ok=b.dataset.choice===q.dataset.answer;q.querySelector('.feedback').textContent=ok?'回答正确。':'再想一想：回到上面的图和代码寻找依据。';q.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))});render();</script></body></html>
