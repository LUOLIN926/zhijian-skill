<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>02｜K 线图解密</title><style>
:root{--g:#4a6741;--up:#a65d4e;--down:#4f7865;--earth:#c4a77d;--ink:#3d3229;--muted:#6b5d4d;--paper:#faf8f5;--soft:#f2eee8;--white:#fff;--shadow:0 10px 28px #3d322918;font-family:"Noto Serif SC","Songti SC",serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:radial-gradient(circle at 15% 0,#c4a77d30,transparent 28rem),var(--paper)}button,input,select{font:inherit}.shell{width:min(1240px,100%);margin:auto}.tabs{display:flex;gap:8px;margin-bottom:14px;overflow:auto}.tab{min-height:44px;padding:8px 16px;border:1px solid var(--earth);border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;font-weight:800;white-space:nowrap}.tab[aria-selected=true]{background:var(--g);color:white;border-color:var(--g)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.stage,.panel{border:1px solid #c4a77d55;border-radius:18px;background:var(--white);box-shadow:var(--shadow)}.stage{min-width:0;overflow:hidden}.canvasbox{position:relative;height:480px;background:linear-gradient(#c4a77d13 1px,transparent 1px),linear-gradient(90deg,#c4a77d13 1px,transparent 1px),var(--paper);background-size:32px 32px}canvas{width:100%;height:100%;display:block}.caption{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--soft)}.metric{padding:12px 16px}.metric span{display:block;color:var(--muted);font:700 12px system-ui}.metric strong{color:var(--g)}.panel{padding:20px;display:grid;align-content:start;gap:15px;max-height:650px;overflow:auto}.panel h2{margin:0;color:var(--g);font-size:1.35rem}.panel p{margin:0;color:var(--muted)}.controls{display:grid;gap:12px}.control{display:grid;gap:4px}.control label{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem}.control input,.control select{width:100%;min-height:44px;accent-color:var(--g)}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:44px;padding:8px 13px;border:1px solid var(--earth);border-radius:10px;background:var(--white);color:var(--ink);cursor:pointer;font-weight:800}.btn.primary{background:var(--g);color:white;border-color:var(--g)}.btn[aria-pressed=true]{background:var(--g);color:white}.insight{padding:13px;border-left:4px solid var(--up);border-radius:0 10px 10px 0;background:var(--soft);color:var(--ink)!important}.data{font:13px/1.55 system-ui;color:var(--muted)}.quiz{padding:13px;border:1px dashed var(--earth);border-radius:12px}.quiz strong{display:block;margin-bottom:8px}.feedback{min-height:26px;color:var(--g);font-weight:800}.legend{display:flex;gap:14px;flex-wrap:wrap;font:700 13px system-ui}.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px}.up{color:var(--up)}.down{color:var(--down)}:focus-visible{outline:3px solid var(--up);outline-offset:3px}@media(max-width:850px){body{padding:12px}.layout{grid-template-columns:1fr}.canvasbox{height:min(58vh,430px)}.panel{max-height:none}.caption{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}}@media(max-width:430px){.canvasbox{height:370px}.caption{grid-template-columns:1fr}.metric:last-child{grid-column:auto}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="shell"><nav class="tabs" role="tablist" aria-label="K 线学习模式"><button class="tab" role="tab" aria-selected="true" aria-controls="p-basic" id="t-basic" data-tab="basic">四价拆解</button><button class="tab" role="tab" aria-selected="false" aria-controls="p-pattern" id="t-pattern" data-tab="pattern" tabindex="-1">形态语境</button><button class="tab" role="tab" aria-selected="false" aria-controls="p-trend" id="t-trend" data-tab="trend" tabindex="-1">走势阅读</button></nav><div class="layout"><section class="stage" aria-label="K 线图形演示"><div class="canvasbox"><canvas id="chart" role="img" aria-describedby="summary"></canvas></div><div class="caption" aria-live="polite"><div class="metric"><span>当前任务</span><strong id="task">调节四个价格</strong></div><div class="metric"><span>方向</span><strong id="direction" class="up">▲ 上涨</strong></div><div class="metric"><span>核心提醒</span><strong id="reminder">先读数据，再讲故事</strong></div></div></section><aside class="panel">
<div id="p-basic" role="tabpanel" aria-labelledby="t-basic"><h2>一根 K 线，四个价格</h2><p>拖动滑块，实体和影线会同步变化。系统会保持“最高价不低于开收盘、最低价不高于开收盘”。</p><div class="controls"><div class="control"><label for="open"><span>开盘价</span><output id="openO">32.0</output></label><input id="open" type="range" min="28" max="38" step="0.5" value="32"></div><div class="control"><label for="close"><span>收盘价</span><output id="closeO">35.0</output></label><input id="close" type="range" min="28" max="38" step="0.5" value="35"></div><div class="control"><label for="high"><span>最高价</span><output id="highO">37.0</output></label><input id="high" type="range" min="28" max="40" step="0.5" value="37"></div><div class="control"><label for="low"><span>最低价</span><output id="lowO">29.0</output></label><input id="low" type="range" min="26" max="38" step="0.5" value="29"></div><button class="btn" id="resetOHLC">重置四价</button></div><p class="insight" id="basicInsight" aria-live="polite"></p></div>
<div id="p-pattern" role="tabpanel" aria-labelledby="t-pattern" hidden><h2>形态必须放回语境</h2><div class="control"><label for="pattern">形态</label><select id="pattern"><option value="doji">十字星</option><option value="hammer">锤头线</option><option value="engulf">看涨吞没</option></select></div><div class="row" aria-label="出现位置"><button class="btn" data-context="down" aria-pressed="true">下跌后</button><button class="btn" data-context="range" aria-pressed="false">震荡中</button><button class="btn" data-context="up" aria-pressed="false">上涨后</button></div><p class="insight" id="patternInsight" aria-live="polite"></p><div class="quiz"><strong>判断：看到锤头线，就能断定下一根上涨吗？</strong><div class="row"><button class="btn" data-quiz="yes">能</button><button class="btn" data-quiz="no">不能</button></div><div class="feedback" id="patternFeedback" aria-live="polite"></div></div></div>
<div id="p-trend" role="tabpanel" aria-labelledby="t-trend" hidden><h2>逐根阅读固定行情</h2><p>使用按钮或在画布聚焦后按左右方向键，逐根查看日期、四价、涨跌幅和成交量。</p><div class="row"><button class="btn" id="prev">← 前一根</button><button class="btn primary" id="next">后一根 →</button><button class="btn" id="replay">自动播放</button><button class="btn" id="resetTrend">重置</button></div><div class="legend"><span><i class="dot" style="background:var(--up)"></i>红色 ▲ 上涨</span><span><i class="dot" style="background:var(--down)"></i>绿色 ▼ 下跌</span></div><p class="insight" id="trendInsight" aria-live="polite"></p></div>
<div class="data" id="summary">图表文本摘要将在这里更新。</div></aside></div></main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const c=$('#chart'),x=c.getContext('2d'),openEl=$('#open'),closeEl=$('#close'),highEl=$('#high'),lowEl=$('#low'),openOut=$('#openO'),closeOut=$('#closeO'),highOut=$('#highO'),lowOut=$('#lowO');let tab='basic',context='down',idx=7,timer=null;const prices=[
{d:'03/03',o:32,h:33,l:31,c:31.4,v:980},{d:'03/04',o:31.5,h:32,l:30.1,c:30.6,v:1220},{d:'03/05',o:30.8,h:31.2,l:29.4,c:29.8,v:1580},{d:'03/06',o:29.7,h:31.5,l:29.2,c:31.1,v:2100},{d:'03/07',o:31,h:32.4,l:30.7,c:32,v:1880},{d:'03/10',o:32.1,h:33,l:31.6,c:32.7,v:1480},{d:'03/11',o:32.8,h:34.2,l:32.5,c:33.9,v:2250},{d:'03/12',o:34,h:34.6,l:33.1,c:33.5,v:1320},{d:'03/13',o:33.4,h:35,l:33.2,c:34.7,v:2400},{d:'03/14',o:34.8,h:35.2,l:33.8,c:34.1,v:1600},{d:'03/17',o:34.1,h:36,l:33.9,c:35.7,v:2780},{d:'03/18',o:35.8,h:36.2,l:34.6,c:35,v:1710}];
function fit(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);draw()}
function bg(w,h){x.clearRect(0,0,w,h);x.fillStyle='#faf8f5';x.fillRect(0,0,w,h);x.strokeStyle='#c4a77d44';x.lineWidth=1;for(let y=45;y<h;y+=55){x.beginPath();x.moveTo(40,y);x.lineTo(w-30,y);x.stroke()}}
function candle(cx,vals,y,min,max,w=42){const py=v=>50+(max-v)/(max-min)*(c.clientHeight-110),up=vals.c>=vals.o,col=up?'#a65d4e':'#4f7865',yo=py(vals.o),yc=py(vals.c),yh=py(vals.h),yl=py(vals.l);x.strokeStyle=col;x.lineWidth=2;x.beginPath();x.moveTo(cx,yh);x.lineTo(cx,yl);x.stroke();x.fillStyle=col;x.fillRect(cx-w/2,Math.min(yo,yc),w,Math.max(3,Math.abs(yo-yc)));return {up,yo,yc,yh,yl}}
function vals(){let o=+openEl.value,cl=+closeEl.value,hi=Math.max(+highEl.value,o,cl),lo=Math.min(+lowEl.value,o,cl);highEl.value=hi;lowEl.value=lo;[openOut,closeOut,highOut,lowOut].forEach((n,i)=>n.value=[o,cl,hi,lo][i].toFixed(1));return{o,c:cl,h:hi,l:lo}}
function drawBasic(){const w=c.clientWidth,h=c.clientHeight,v=vals();bg(w,h);const min=Math.min(25,v.l-2),max=Math.max(41,v.h+2),p=candle(w/2,v,0,min,max,68);x.fillStyle='#6b5d4d';x.font='700 13px system-ui';x.textAlign='right';[['最高',v.h,p.yh],['开盘',v.o,p.yo],['收盘',v.c,p.yc],['最低',v.l,p.yl]].forEach(a=>x.fillText(`${a[0]} ${a[1].toFixed(1)}`,w-28,a[2]+4));x.textAlign='left';x.fillText('上影线',w/2+45,(p.yh+Math.min(p.yo,p.yc))/2);x.fillText('实体',w/2+45,(p.yo+p.yc)/2);x.fillText('下影线',w/2+45,(p.yl+Math.max(p.yo,p.yc))/2);const d=v.c-v.o;direction.textContent=d>=0?'▲ 上涨':'▼ 下跌';direction.className=d>=0?'up':'down';basicInsight.textContent=`实体 ${Math.abs(d).toFixed(1)} 元；上影线 ${(v.h-Math.max(v.o,v.c)).toFixed(1)} 元；下影线 ${(Math.min(v.o,v.c)-v.l).toFixed(1)} 元。实体描述开收盘差，不等于未来力量。`;summary.textContent=`文本摘要：开盘 ${v.o.toFixed(1)}，最高 ${v.h.toFixed(1)}，最低 ${v.l.toFixed(1)}，收盘 ${v.c.toFixed(1)}；${d>=0?'上涨':'下跌'} K 线。`}
const pat={doji:[{o:32,c:32.1,h:35,l:29}],hammer:[{o:33,c:34,h:34.4,l:27}],engulf:[{o:35,c:32,h:35.5,l:31.5},{o:31.5,c:36,h:36.5,l:31}]};
function drawPattern(){const w=c.clientWidth,h=c.clientHeight,a=pat[pattern.value];bg(w,h);a.forEach((v,i)=>candle(w/2+(i-(a.length-1)/2)*90,v,0,26,38,52));x.fillStyle='#3d3229';x.font='800 20px system-ui';x.textAlign='center';x.fillText(pattern.options[pattern.selectedIndex].text,w/2,35);const texts={doji:'开盘与收盘接近，显示当期多空拉锯。',hammer:'长下影显示价格曾下探后回升。',engulf:'后一根上涨实体覆盖前一根下跌实体。'},ctx={down:'下跌后可作为“抛压是否减弱”的观察线索。',range:'震荡中同类形态可能频繁出现，误判更多。',up:'上涨后不能沿用底部解释，应观察获利回吐和后续确认。'};patternInsight.textContent=texts[pattern.value]+ctx[context]+' 形态需要后续价格、成交量和位置共同验证。';summary.textContent=`文本摘要：当前展示${pattern.options[pattern.selectedIndex].text}，出现位置为${context==='down'?'下跌后':context==='range'?'震荡中':'上涨后'}。它提供观察线索，不构成涨跌预测。`;direction.textContent='◇ 线索';direction.className='';task.textContent='比较位置改变解释'}
function drawTrend(){const w=c.clientWidth,h=c.clientHeight;bg(w,h);const view=prices.slice(0,idx+1),min=Math.min(...prices.map(d=>d.l))-1,max=Math.max(...prices.map(d=>d.h))+1,pad=55,sp=(w-pad-25)/prices.length;view.forEach((v,i)=>candle(pad+i*sp,v,0,min,max,Math.max(6,sp*.55)));const d=prices[idx],pct=(d.c-d.o)/d.o*100,up=d.c>=d.o;x.strokeStyle='#3d3229aa';x.setLineDash([5,4]);x.beginPath();x.moveTo(pad+idx*sp,35);x.lineTo(pad+idx*sp,h-35);x.stroke();x.setLineDash([]);x.fillStyle='#6b5d4d';x.font='12px system-ui';x.textAlign='center';x.fillText(d.d,pad+idx*sp,h-12);direction.textContent=up?'▲ 上涨':'▼ 下跌';direction.className=up?'up':'down';task.textContent=`阅读第 ${idx+1}/${prices.length} 根`;trendInsight.textContent=`${d.d}：开 ${d.o.toFixed(1)}，高 ${d.h.toFixed(1)}，低 ${d.l.toFixed(1)}，收 ${d.c.toFixed(1)}，${up?'上涨':'下跌'} ${Math.abs(pct).toFixed(2)}%，成交量 ${d.v}。`;summary.textContent='文本摘要：'+trendInsight.textContent+' 当前序列先下跌、再回升；单根 K 线需要放进整段路径理解。'}
function draw(){if(!c.clientWidth)return;tab==='basic'?drawBasic():tab==='pattern'?drawPattern():drawTrend()}
$$('.tab').forEach((b,i)=>{b.onclick=()=>switchTab(b.dataset.tab);b.onkeydown=e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const tabs=$$('.tab'),n=(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[n].focus();tabs[n].click()}});function switchTab(v){tab=v;stop();$$('.tab').forEach(b=>{const on=b.dataset.tab===v;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;$(`#p-${b.dataset.tab}`).hidden=!on});reminder.textContent=v==='basic'?'先读数据，再讲故事':v==='pattern'?'形态不是预测按钮':'单根必须放进路径';draw()}
[openEl,closeEl,highEl,lowEl].forEach(n=>n.oninput=draw);resetOHLC.onclick=()=>{openEl.value=32;closeEl.value=35;highEl.value=37;lowEl.value=29;draw()};pattern.onchange=draw;$$('[data-context]').forEach(b=>b.onclick=()=>{context=b.dataset.context;$$('[data-context]').forEach(q=>q.setAttribute('aria-pressed',q===b));draw()});$$('[data-quiz]').forEach(b=>b.onclick=()=>patternFeedback.textContent=b.dataset.quiz==='no'?'正确：形态只能成为待验证线索。':'再想想：相同形态在不同位置可能有不同结果。');function step(n){idx=Math.max(0,Math.min(prices.length-1,idx+n));draw()}prev.onclick=()=>step(-1);next.onclick=()=>step(1);resetTrend.onclick=()=>{stop();idx=0;draw()};function stop(){clearInterval(timer);timer=null;replay.textContent='自动播放'}replay.onclick=()=>{if(timer){stop();return}replay.textContent='暂停';if(idx>=prices.length-1)idx=0;timer=setInterval(()=>{if(idx>=prices.length-1)stop();else step(1)},500)};c.tabIndex=0;c.addEventListener('keydown',e=>{if(tab!=='trend')return;if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}if(e.key==='ArrowRight'){e.preventDefault();step(1)}});new ResizeObserver(fit).observe(c);draw();
</script></body></html>
