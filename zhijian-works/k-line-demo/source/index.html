<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K 线图解密 — 股票蜡烛图入门</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #4A6741;
      --color-primary-dark: #3A5334;
      --color-primary-light: #6B8E63;
      --color-secondary: #A0522D;
      --color-accent: #8B7355;
      --color-earth: #C4A77D;
      --color-cream: #FAF8F5;
      --color-cream-dark: #F5F2ED;
      --color-text: #3D3229;
      --color-text-light: #6B5D4D;
      --color-text-muted: #766958;
      --color-sky: #5B8A8A;
      --color-sky-dark: #4A7575;
      --color-lavender: #c2a2d2;
      --color-moss: #6B8E6B;
      --color-rust: #B8765A;
      --color-success: #5B8C5A;
      --color-warning: #C9844A;
      --color-danger: #A65D4E;
      --font-family: 'Noto Serif SC', 'Noto Serif', serif;
      --font-weight-regular: 400;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;
      --font-weight-bold: 800;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-2xl: 48px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 8px rgba(61, 50, 41, 0.08);
      --shadow-md: 0 4px 16px rgba(61, 50, 41, 0.12);
      --shadow-lg: 0 8px 32px rgba(61, 50, 41, 0.16);
      --transition-fast: 0.15s ease-out;
      --transition-normal: 0.3s ease-out;
      --transition-slow: 0.5s ease-out;
      --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-family);
      font-weight: var(--font-weight-regular);
      color: var(--color-text);
      background:
        radial-gradient(circle at 16% 10%, rgba(196, 167, 125, 0.2), transparent 28rem),
        linear-gradient(180deg, var(--color-cream) 0%, var(--color-cream-dark) 100%);
      padding: var(--spacing-lg);
    }

    button {
      font: inherit;
    }

    .demo-shell {
      width: min(1080px, 100%);
      margin: 0 auto;
      display: grid;
      gap: var(--spacing-lg);
    }

    .mode-tabs {
      display: flex;
      gap: var(--spacing-xs);
      padding: var(--spacing-sm) var(--spacing-lg);
    }

    .mode-tab {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid var(--color-earth);
      border-radius: var(--radius-full);
      background: transparent;
      color: var(--color-text-light);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: var(--font-weight-semibold);
      transition: all var(--transition-fast);
    }

    .mode-tab:hover {
      background: var(--color-cream-dark);
    }

    .mode-tab.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: white;
    }

    .demo-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: var(--spacing-lg);
      align-items: stretch;
    }

    .stage-card {
      background: white;
      border: 1px solid var(--color-cream-dark);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .canvas-wrap {
      width: 100%;
      aspect-ratio: 16 / 10;
      min-height: 380px;
      background:
        linear-gradient(135deg, rgba(74, 103, 65, 0.08), transparent 45%),
        var(--color-cream);
      position: relative;
      cursor: crosshair;
    }

    #demoCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .tooltip {
      position: absolute;
      display: none;
      padding: var(--spacing-sm) var(--spacing-md);
      background: white;
      border: 1px solid var(--color-earth);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      font-size: 0.82rem;
      line-height: 1.6;
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
    }

    .tooltip .date {
      font-weight: var(--font-weight-bold);
      color: var(--color-text);
    }

    .tooltip .up {
      color: var(--color-success);
    }

    .tooltip .down {
      color: var(--color-danger);
    }

    .stage-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-md);
      padding: var(--spacing-md);
      border-top: 1px solid var(--color-cream-dark);
    }

    .metric {
      display: grid;
      gap: 2px;
    }

    .metric span {
      color: var(--color-text-muted);
      font-size: 0.78rem;
      font-weight: var(--font-weight-semibold);
    }

    .metric strong {
      color: var(--color-primary-dark);
      font-size: 1.1rem;
    }

    .info-card {
      background: white;
      border: 1px solid var(--color-cream-dark);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: var(--spacing-lg);
      display: grid;
      align-content: start;
      gap: var(--spacing-md);
    }

    .info-card h2 {
      color: var(--color-primary-dark);
      font-size: 1.25rem;
    }

    .info-card p {
      color: var(--color-text-light);
      line-height: 1.7;
    }

    .knowledge-list {
      display: grid;
      gap: var(--spacing-md);
      list-style: none;
    }

    .knowledge-item {
      padding: var(--spacing-md);
      border: 1px solid var(--color-cream-dark);
      border-radius: var(--radius-md);
      background: var(--color-cream);
      transition: all var(--transition-fast);
    }

    .knowledge-item.active {
      border-color: var(--color-primary);
      background: color-mix(in oklch, var(--color-primary) 8%, white);
    }

    .knowledge-item h3 {
      color: var(--color-primary-dark);
      font-size: 0.95rem;
      margin-bottom: var(--spacing-xs);
    }

    .knowledge-item p {
      font-size: 0.85rem;
      color: var(--color-text-light);
      margin: 0;
    }

    .pattern-nav {
      display: grid;
      gap: var(--spacing-sm);
    }

    .pattern-btn {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: var(--spacing-sm);
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--color-cream-dark);
      border-radius: var(--radius-sm);
      background: var(--color-cream);
      color: var(--color-text);
      cursor: pointer;
      text-align: left;
      transition: all var(--transition-fast);
    }

    .pattern-btn:hover,
    .pattern-btn.active {
      border-color: var(--color-primary);
      background: color-mix(in oklch, var(--color-primary) 8%, white);
      transform: translateY(-1px);
    }

    .pattern-preview {
      width: 40px;
      height: 32px;
      border-radius: 4px;
      background: var(--color-cream-dark);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pattern-btn strong {
      color: var(--color-primary-dark);
      font-size: 0.9rem;
    }

    .pattern-btn span {
      color: var(--color-text-muted);
      font-size: 0.78rem;
    }

    .controls {
      display: grid;
      gap: var(--spacing-sm);
      margin-top: var(--spacing-sm);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: var(--font-weight-bold);
      transition: transform var(--transition-fast), background var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .btn-primary {
      background: var(--color-primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--color-primary-dark);
    }

    .btn-secondary {
      background: var(--color-cream);
      border-color: var(--color-earth);
      color: var(--color-text);
    }

    .btn-secondary:hover {
      background: var(--color-cream-dark);
    }

    .legend-row {
      display: flex;
      gap: var(--spacing-md);
      align-items: center;
      padding: var(--spacing-sm) 0;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--color-text-muted);
    }

    .legend-swatch {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid var(--color-earth);
    }

    @media (max-width: 820px) {
      body {
        padding: var(--spacing-md);
      }

      .demo-layout {
        grid-template-columns: 1fr;
      }

      .canvas-wrap {
        min-height: 280px;
      }

      .stage-caption {
        flex-wrap: wrap;
      }

      .mode-tabs {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <main class="demo-shell">
    <div class="mode-tabs">
      <button class="mode-tab active" type="button" data-mode="0">基础认识</button>
      <button class="mode-tab" type="button" data-mode="1">常见形态</button>
      <button class="mode-tab" type="button" data-mode="2">走势分析</button>
    </div>

    <section class="demo-layout" aria-label="交互演示区域">
      <article class="stage-card">
        <div class="canvas-wrap">
          <canvas id="demoCanvas"></canvas>
          <div class="tooltip" id="tooltip"></div>
        </div>
        <div class="stage-caption">
          <div class="metric">
            <span>当前模式</span>
            <strong id="modeText">基础认识</strong>
          </div>
          <div class="metric">
            <span>鼠标位置</span>
            <strong id="hoverText">移动鼠标查看数据</strong>
          </div>
          <div class="legend-row">
            <span class="legend-item">
              <span class="legend-swatch" style="background:var(--color-success)"></span> 上涨
            </span>
            <span class="legend-item">
              <span class="legend-swatch" style="background:var(--color-danger)"></span> 下跌
            </span>
          </div>
        </div>
      </article>

      <aside class="info-card" id="infoPanel">
        <!-- Dynamic content -->
      </aside>
    </section>
  </main>

  <script>
    // === Data: Simulated stock data ===
    function generateStockData(days, basePrice) {
      const data = [];
      let price = basePrice;
      const startDate = new Date(2025, 0, 2);
      for (let i = 0; i < days; i++) {
        const date = new Date(startDate);
        date.setDate(date.getDate() + i);
        const change = (Math.random() - 0.48) * 3.5;
        const open = price;
        const close = +(price + change).toFixed(2);
        const high = +(Math.max(open, close) + Math.random() * 2.5).toFixed(2);
        const low = +(Math.min(open, close) - Math.random() * 2.5).toFixed(2);
        const volume = Math.round(800 + Math.random() * 2200);
        data.push({
          date: `${date.getMonth() + 1}/${date.getDate()}`,
          open: +open.toFixed(2),
          close,
          high,
          low,
          volume,
          isUp: close >= open
        });
        price = close;
      }
      return data;
    }

    const stockData = generateStockData(24, 32.5);

    // === Pattern data for mode 2 ===
    const patterns = [
      {
        name: '大阳线',
        desc: '实体很长、几乎没有上下影线。表示买方力量强劲，价格大幅上涨，市场情绪乐观。',
        candles: [
          { open: 30, close: 38, high: 38.5, low: 29.8 }
        ]
      },
      {
        name: '大阴线',
        desc: '实体很长、几乎没有上下影线。表示卖方力量强劲，价格大幅下跌，市场情绪悲观。',
        candles: [
          { open: 38, close: 30, high: 38.2, low: 29.5 }
        ]
      },
      {
        name: '十字星',
        desc: '开盘价和收盘价几乎相等，实体极短。表示多空力量均衡，可能出现趋势反转信号。',
        candles: [
          { open: 34, close: 34.1, high: 37, low: 31 }
        ]
      },
      {
        name: '锤头线',
        desc: '实体小、下影线长（实体的 2-3 倍），上影线极短。出现在下跌趋势底部，预示反转向上。',
        candles: [
          { open: 33, close: 34, high: 34.3, low: 28 }
        ]
      },
      {
        name: '看涨吞没',
        desc: '第二根阳线的实体完全包住了前一根阴线的实体。表示买方力量突然增强，趋势可能反转。',
        candles: [
          { open: 36, close: 32, high: 36.5, low: 31.5 },
          { open: 31, close: 37, high: 37.5, low: 30.5 }
        ]
      }
    ];

    // === State ===
    const state = {
      mode: 0,       // 0=basic, 1=pattern, 2=trend
      patternIndex: 0,
      hoveredIndex: -1,
      animProgress: 0
    };

    // === Canvas Setup ===
    const canvas = document.getElementById('demoCanvas');
    const ctx = canvas.getContext('2d');
    const tooltipEl = document.getElementById('tooltip');
    let canvasW = 0, canvasH = 0;

    function fitCanvas() {
      const rect = canvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      canvasW = rect.width;
      canvasH = rect.height;
      draw();
    }

    // === Drawing Helpers ===
    const UP_COLOR = '#5B8C5A';
    const DOWN_COLOR = '#A65D4E';
    const GRID_COLOR = 'rgba(196, 167, 125, 0.25)';
    const TEXT_COLOR = '#6B5D4D';
    const BG_COLOR = '#FAF8F5';

    function getCSSVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    // === Mode 0: Basic — single candle breakdown ===
    function drawBasicMode() {
      const cx = canvasW / 2;
      const cy = canvasH / 2;
      const candleH = canvasH * 0.45;
      const bodyH = candleH * 0.55;
      const wickTop = (candleH - bodyH) / 2;
      const candleW = Math.min(48, canvasW * 0.08);

      const topY = cy - candleH / 2;
      const bodyTop = topY + wickTop;
      const bodyBottom = bodyTop + bodyH;
      const bottomY = cy + candleH / 2;
      const midY = cy;

      // Background gradient
      ctx.fillStyle = BG_COLOR;
      ctx.fillRect(0, 0, canvasW, canvasH);

      // Price scale lines
      const priceLabels = [
        { y: topY, label: '最高价 37.2' },
        { y: bodyTop, label: '收盘价 35.0' },
        { y: bodyBottom, label: '开盘价 32.0' },
        { y: bottomY, label: '最低价 28.5' }
      ];

      priceLabels.forEach(({ y, label }) => {
        ctx.strokeStyle = GRID_COLOR;
        ctx.lineWidth = 1;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(canvasW * 0.12, y);
        ctx.lineTo(canvasW * 0.88, y);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = TEXT_COLOR;
        ctx.font = '12px "Noto Serif SC"';
        ctx.textAlign = 'left';
        ctx.fillText(label, canvasW * 0.89, y + 4);
      });

      // Wick (upper)
      ctx.strokeStyle = UP_COLOR;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx, topY);
      ctx.lineTo(cx, bodyTop);
      ctx.stroke();

      // Wick (lower)
      ctx.beginPath();
      ctx.moveTo(cx, bodyBottom);
      ctx.lineTo(cx, bottomY);
      ctx.stroke();

      // Body
      const bodyGradient = ctx.createLinearGradient(cx - candleW / 2, bodyTop, cx + candleW / 2, bodyTop);
      bodyGradient.addColorStop(0, 'rgba(91, 140, 90, 0.9)');
      bodyGradient.addColorStop(1, 'rgba(91, 140, 90, 0.7)');
      ctx.fillStyle = bodyGradient;
      ctx.fillRect(cx - candleW / 2, bodyTop, candleW, bodyH);
      ctx.strokeStyle = UP_COLOR;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(cx - candleW / 2, bodyTop, candleW, bodyH);

      // Labels with arrows
      const labels = [
        { y: topY, text: '上影线', dx: -60, dy: 0 },
        { y: bodyTop + bodyH / 2, text: '实体', dx: 70, dy: 0 },
        { y: bottomY, text: '下影线', dx: -60, dy: 0 }
      ];

      labels.forEach(({ y, text, dx, dy }) => {
        const tx = cx + dx;
        const ty = y + dy;
        ctx.fillStyle = '#3D3229';
        ctx.font = 'bold 13px "Noto Serif SC"';
        ctx.textAlign = dx < 0 ? 'right' : 'left';
        ctx.fillText(text, tx, ty + 4);

        // Arrow line
        ctx.strokeStyle = 'rgba(61, 50, 41, 0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(dx < 0 ? tx + 4 : tx - 4, ty);
        ctx.lineTo(dx < 0 ? cx - candleW / 2 - 2 : cx + candleW / 2 + 2, y);
        ctx.stroke();
      });

      // Bottom annotations
      const annotations = [
        { x: canvasW * 0.2, text: '上影线 = 最高价 − max(开盘, 收盘)', sub: '反映价格冲高后回落' },
        { x: canvasW * 0.5, text: '实体 = |开盘 − 收盘|', sub: '实体越长，力量越强' },
        { x: canvasW * 0.8, text: '下影线 = min(开盘, 收盘) − 最低价', sub: '反映价格探底后回升' }
      ];

      ctx.font = '11px "Noto Serif SC"';
      ctx.textAlign = 'center';
      annotations.forEach(({ x, text, sub }) => {
        ctx.fillStyle = TEXT_COLOR;
        ctx.fillText(text, x, canvasH - 40);
        ctx.fillStyle = 'rgba(107, 93, 77, 0.6)';
        ctx.fillText(sub, x, canvasH - 22);
      });
    }

    // === Mode 1: Pattern ===
    function drawPatternMode() {
      ctx.fillStyle = BG_COLOR;
      ctx.fillRect(0, 0, canvasW, canvasH);

      const pattern = patterns[state.patternIndex];
      const numCandles = pattern.candles.length;
      const candleSpacing = Math.min(80, canvasW * 0.15);
      const totalWidth = numCandles * candleSpacing;
      const startX = (canvasW - totalWidth) / 2 + candleSpacing / 2;

      // Find price range
      let minPrice = Infinity, maxPrice = -Infinity;
      pattern.candles.forEach(c => {
        if (c.low < minPrice) minPrice = c.low;
        if (c.high > maxPrice) maxPrice = c.high;
      });
      const padding = (maxPrice - minPrice) * 0.15;
      minPrice -= padding;
      maxPrice += padding;

      const chartTop = canvasH * 0.15;
      const chartBottom = canvasH * 0.8;
      const chartH = chartBottom - chartTop;

      function priceToY(p) {
        return chartTop + chartH * (1 - (p - minPrice) / (maxPrice - minPrice));
      }

      const candleW = Math.min(44, candleSpacing * 0.55);

      pattern.candles.forEach((c, i) => {
        const x = startX + i * candleSpacing;
        const isUp = c.close >= c.open;
        const color = isUp ? UP_COLOR : DOWN_COLOR;

        const yHigh = priceToY(c.high);
        const yLow = priceToY(c.low);
        const yOpen = priceToY(c.open);
        const yClose = priceToY(c.close);
        const bodyTopY = Math.min(yOpen, yClose);
        const bodyBottomY = Math.max(yOpen, yClose);
        const bodyHeight = Math.max(bodyBottomY - bodyTopY, 2);

        // Wick
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, yHigh);
        ctx.lineTo(x, yLow);
        ctx.stroke();

        // Body
        ctx.fillStyle = isUp ? 'rgba(91, 140, 90, 0.85)' : 'rgba(166, 93, 78, 0.85)';
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.fillRect(x - candleW / 2, bodyTopY, candleW, bodyHeight);
        ctx.strokeRect(x - candleW / 2, bodyTopY, candleW, bodyHeight);

        // Price labels
        ctx.fillStyle = TEXT_COLOR;
        ctx.font = '11px "Noto Serif SC"';
        ctx.textAlign = 'center';
        if (i === 0) {
          ctx.fillText(c.high.toFixed(1), x, yHigh - 8);
          ctx.fillText(c.low.toFixed(1), x, yLow + 16);
        }
      });

      // Pattern name banner
      ctx.fillStyle = 'rgba(61, 50, 41, 0.7)';
      ctx.font = 'bold 18px "Noto Serif SC"';
      ctx.textAlign = 'center';
      ctx.fillText(pattern.name, canvasW / 2, canvasH * 0.06);
    }

    // === Mode 2: Trend ===
    function drawTrendMode() {
      ctx.fillStyle = BG_COLOR;
      ctx.fillRect(0, 0, canvasW, canvasH);

      const data = stockData;
      const n = data.length;
      const padding = { top: 30, bottom: 50, left: 55, right: 20 };
      const chartW = canvasW - padding.left - padding.right;
      const priceChartH = canvasH - padding.top - padding.bottom - 50;
      const volumeH = 40;

      let minPrice = Infinity, maxPrice = -Infinity;
      let maxVol = 0;
      data.forEach(d => {
        if (d.low < minPrice) minPrice = d.low;
        if (d.high > maxPrice) maxPrice = d.high;
        if (d.volume > maxVol) maxVol = d.volume;
      });
      const pPad = (maxPrice - minPrice) * 0.08;
      minPrice -= pPad;
      maxPrice += pPad;

      function priceToY(p) {
        return padding.top + priceChartH * (1 - (p - minPrice) / (maxPrice - minPrice));
      }

      const candleSpacing = chartW / n;
      const candleW = Math.max(3, candleSpacing * 0.65);

      // Grid lines
      const steps = 5;
      for (let i = 0; i <= steps; i++) {
        const p = minPrice + (maxPrice - minPrice) * i / steps;
        const y = priceToY(p);
        ctx.strokeStyle = GRID_COLOR;
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(canvasW - padding.right, y);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = TEXT_COLOR;
        ctx.font = '10px "Noto Serif SC"';
        ctx.textAlign = 'right';
        ctx.fillText(p.toFixed(1), padding.left - 6, y + 3);
      }

      // Volume bars
      const volBase = padding.top + priceChartH + 10;
      data.forEach((d, i) => {
        const x = padding.left + candleSpacing * i + candleSpacing / 2;
        const barH = (d.volume / maxVol) * volumeH;
        ctx.fillStyle = d.isUp ? 'rgba(91, 140, 90, 0.35)' : 'rgba(166, 93, 78, 0.35)';
        ctx.fillRect(x - candleW / 2, volBase + volumeH - barH, candleW, barH);
      });

      // Candlesticks
      const isAnimating = state.animProgress < 1;
      const visibleCount = isAnimating ? Math.floor(state.animProgress * n) : n;

      data.forEach((d, i) => {
        if (i >= visibleCount) return;

        const x = padding.left + candleSpacing * i + candleSpacing / 2;
        const isUp = d.isUp;
        const color = isUp ? UP_COLOR : DOWN_COLOR;

        const yHigh = priceToY(d.high);
        const yLow = priceToY(d.low);
        const yOpen = priceToY(d.open);
        const yClose = priceToY(d.close);
        const bodyTopY = Math.min(yOpen, yClose);
        const bodyHeight = Math.max(Math.abs(yClose - yOpen), 1);

        // Highlight hovered candle
        if (i === state.hoveredIndex) {
          ctx.fillStyle = 'rgba(196, 167, 125, 0.15)';
          ctx.fillRect(padding.left + candleSpacing * i, padding.top, candleSpacing, priceChartH);
        }

        // Wick
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x, yHigh);
        ctx.lineTo(x, yLow);
        ctx.stroke();

        // Body
        ctx.fillStyle = isUp ? 'rgba(91, 140, 90, 0.85)' : 'rgba(166, 93, 78, 0.85)';
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.fillRect(x - candleW / 2, bodyTopY, candleW, bodyHeight);
        ctx.strokeRect(x - candleW / 2, bodyTopY, candleW, bodyHeight);

        // Date labels (every 4th)
        if (i % 4 === 0 || i === n - 1) {
          ctx.fillStyle = TEXT_COLOR;
          ctx.font = '9px "Noto Serif SC"';
          ctx.textAlign = 'center';
          ctx.fillText(d.date, x, canvasH - 8);
        }
      });
    }

    // === Main Draw ===
    function draw() {
      switch (state.mode) {
        case 0: drawBasicMode(); break;
        case 1: drawPatternMode(); break;
        case 2: drawTrendMode(); break;
      }
    }

    // === Animation for trend mode ===
    let animFrame = null;
    function startTrendAnim() {
      state.animProgress = 0;
      cancelAnimationFrame(animFrame);
      const startTime = performance.now();
      const duration = 1800;
      function tick(now) {
        const elapsed = now - startTime;
        state.animProgress = Math.min(1, elapsed / duration);
        draw();
        if (state.animProgress < 1) {
          animFrame = requestAnimationFrame(tick);
        }
      }
      animFrame = requestAnimationFrame(tick);
    }

    // === Info Panel ===
    function updateInfoPanel() {
      const panel = document.getElementById('infoPanel');

      if (state.mode === 0) {
        panel.innerHTML = `
          <h2>K 线的构成</h2>
          <p>一根 K 线由四个价格数据构成。观察画布上的标注，理解每部分的含义。</p>
          <ul class="knowledge-list">
            <li class="knowledge-item active">
              <h3>实体（Body）</h3>
              <p>开盘价与收盘价之间的区域。实体越长，表示该方向的力量越强。绿色表示收盘高于开盘（上涨），红色表示相反。</p>
            </li>
            <li class="knowledge-item">
              <h3>上影线（Upper Shadow）</h3>
              <p>从实体顶部延伸到最高价的细线。表示价格曾冲高但被压回，上方有卖压。</p>
            </li>
            <li class="knowledge-item">
              <h3>下影线（Lower Shadow）</h3>
              <p>从实体底部延伸到最低价的细线。表示价格曾探底但被拉起，下方有支撑。</p>
            </li>
          </ul>
          <div class="controls">
            <p style="font-size:0.85rem;color:var(--color-text-muted);text-align:center;">切换到其他模式，学习更多形态知识</p>
          </div>
        `;
      } else if (state.mode === 1) {
        const p = patterns[state.patternIndex];
        panel.innerHTML = `
          <h2>常见 K 线形态</h2>
          <p>不同形状的 K 线传递不同的市场信号。选择下方形态，在画布上观察其特征。</p>
          <div class="pattern-nav">
            ${patterns.map((pat, i) => `
              <button class="pattern-btn ${i === state.patternIndex ? 'active' : ''}" type="button" data-pattern="${i}">
                <span class="pattern-preview" style="background:${i === state.patternIndex ? 'color-mix(in oklch, var(--color-primary) 8%, white)' : 'var(--color-cream-dark)'}">
                  <span style="font-size:1.1rem;">${pat.candles[0].close >= pat.candles[0].open ? '⬆' : '⬇'}</span>
                </span>
                <span>
                  <strong>${pat.name}</strong>
                  <span>${pat.desc.slice(0, 20)}…</span>
                </span>
              </button>
            `).join('')}
          </div>
          <div style="padding:var(--spacing-md);background:var(--color-cream);border-radius:var(--radius-md);border:1px solid var(--color-cream-dark);">
            <p style="font-size:0.88rem;color:var(--color-text);line-height:1.7;">
              <strong style="color:var(--color-primary-dark);">${p.name}</strong><br>
              ${p.desc}
            </p>
          </div>
        `;
        panel.querySelectorAll('.pattern-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            state.patternIndex = parseInt(btn.dataset.pattern);
            updateInfoPanel();
            draw();
          });
        });
      } else if (state.mode === 2) {
        panel.innerHTML = `
          <h2>走势分析</h2>
          <p>这是一段模拟的股票 K 线图。鼠标悬停在画布上，查看每根 K 线的详细数据。配合下方成交量，理解价格与量能的关系。</p>
          <ul class="knowledge-list">
            <li class="knowledge-item">
              <h3>价量关系</h3>
              <p>价格上涨伴随放量，说明上涨有量能支撑；缩量上涨可能缺乏持续性。</p>
            </li>
            <li class="knowledge-item">
              <h3>支撑与阻力</h3>
              <p>多次探底不破的位置形成支撑，多次冲高回落的位置形成阻力。</p>
            </li>
            <li class="knowledge-item">
              <h3>趋势判断</h3>
              <p>连续的高点和低点逐步抬高为上升趋势，反之为下降趋势。</p>
            </li>
          </ul>
          <div class="controls">
            <button class="btn btn-secondary" id="replayBtn" type="button">重播动画</button>
          </div>
        `;
        const replayBtn = document.getElementById('replayBtn');
        if (replayBtn) replayBtn.addEventListener('click', startTrendAnim);
      }

      const modeNames = ['基础认识', '常见形态', '走势分析'];
      document.getElementById('modeText').textContent = modeNames[state.mode];
    }

    // === Mode Tabs ===
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        state.mode = parseInt(tab.dataset.mode);
        state.hoveredIndex = -1;
        document.getElementById('hoverText').textContent = '移动鼠标查看数据';
        tooltipEl.style.display = 'none';
        updateInfoPanel();

        if (state.mode === 2) {
          startTrendAnim();
        } else {
          draw();
        }
      });
    });

    // === Canvas Mouse Interaction (trend mode) ===
    canvas.addEventListener('mousemove', (e) => {
      if (state.mode !== 2) return;

      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const n = stockData.length;
      const padding = { top: 30, bottom: 50, left: 55, right: 20 };
      const chartW = canvasW - padding.left - padding.right;
      const candleSpacing = chartW / n;

      const index = Math.floor((mx - padding.left) / candleSpacing);
      if (index >= 0 && index < n && mx >= padding.left && mx <= canvasW - padding.right) {
        state.hoveredIndex = index;
        const d = stockData[index];
        const change = d.close - d.open;
        const pct = ((change / d.open) * 100).toFixed(2);
        const cls = d.isUp ? 'up' : 'down';
        const sign = d.isUp ? '+' : '';

        tooltipEl.style.display = 'block';
        tooltipEl.innerHTML = `
          <div class="date">${d.date}</div>
          <div>开 <span class="${cls}">${d.open.toFixed(2)}</span> · 收 <span class="${cls}">${d.close.toFixed(2)}</span></div>
          <div>高 ${d.high.toFixed(2)} · 低 ${d.low.toFixed(2)}</div>
          <div>涨跌 <span class="${cls}">${sign}${pct}%</span> · 量 ${d.volume}</div>
        `;

        let tx = e.clientX - rect.left + 16;
        let ty = e.clientY - rect.top - 20;
        if (tx + 180 > canvasW) tx = e.clientX - rect.left - 190;
        if (ty < 10) ty = 10;
        tooltipEl.style.left = tx + 'px';
        tooltipEl.style.top = ty + 'px';

        document.getElementById('hoverText').textContent = `${d.date} · ${sign}${pct}%`;
        draw();
      } else {
        state.hoveredIndex = -1;
        tooltipEl.style.display = 'none';
        document.getElementById('hoverText').textContent = '移动鼠标查看数据';
        draw();
      }
    });

    canvas.addEventListener('mouseleave', () => {
      state.hoveredIndex = -1;
      tooltipEl.style.display = 'none';
      document.getElementById('hoverText').textContent = '移动鼠标查看数据';
      if (state.mode === 2) draw();
    });

    // === Init ===
    function init() {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          fitCanvas();
          updateInfoPanel();
          if (state.mode === 2) startTrendAnim();
        });
      });
    }

    window.addEventListener('resize', fitCanvas);
    window.addEventListener('load', init);
    init();
  </script>
</body>
</html>
