<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>04｜MACD 指标入门</title><style>
:root{--g:#4a6741;--up:#a65d4e;--down:#4f7865;--dif:#4f8888;--dea:#9b7958;--earth:#c4a77d;--ink:#3d3229;--muted:#6b5d4d;--paper:#faf8f5;--soft:#f2eee8;--white:#fff;font-family:"Noto Serif SC","Songti SC",serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:radial-gradient(circle at 90% 0,#4f88881c,transparent 30rem),var(--paper)}button,input,select{font:inherit}.shell{width:min(1240px,100%);margin:auto}.tabs{display:flex;gap:8px;margin-bottom:14px;overflow:auto}.tab{min-height:44px;padding:8px 17px;border:1px solid var(--earth);border-radius:999px;background:transparent;color:var(--muted);font-weight:800;cursor:pointer;white-space:nowrap}.tab[aria-selected=true]{background:var(--g);color:white;border-color:var(--g)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px}.stage,.panel{border:1px solid #c4a77d55;border-radius:18px;background:white;box-shadow:0 10px 28px #3d322918}.stage{overflow:hidden}.canvasbox{height:505px;background:linear-gradient(#c4a77d13 1px,transparent 1px),var(--paper);background-size:100% 50px;touch-action:none}canvas{width:100%;height:100%;display:block}.legend{display:flex;gap:15px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--soft);font:700 13px system-ui}.sw{display:inline-block;width:18px;height:4px;margin-right:6px;vertical-align:middle}.panel{padding:20px;display:grid;align-content:start;gap:14px;max-height:660px;overflow:auto}.panel h2{margin:0;color:var(--g);font-size:1.35rem}.panel h3{margin:0;color:var(--g)}.panel p{margin:0;color:var(--muted)}.formula{padding:12px;border-radius:10px;background:var(--soft);font:700 13px/1.7 system-ui}.controls{display:grid;gap:10px}.control{display:grid;gap:4px}.control label{display:flex;justify-content:space-between;font-weight:800}.control input,.control select{width:100%;min-height:44px;accent-color:var(--g)}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:44px;padding:8px 13px;border:1px solid var(--earth);border-radius:10px;background:white;color:var(--ink);font-weight:800;cursor:pointer}.btn.primary,.btn[aria-pressed=true]{background:var(--g);border-color:var(--g);color:white}.insight{padding:13px;border-left:4px solid var(--up);border-radius:0 10px 10px 0;background:var(--soft);color:var(--ink)!important}.warning{border-left-color:var(--earth)}.progress{height:8px;overflow:hidden;border-radius:999px;background:var(--soft)}.progress i{display:block;height:100%;width:100%;background:var(--g)}.summary{font:13px/1.6 system-ui;color:var(--muted)}.quiz{padding:13px;border:1px dashed var(--earth);border-radius:12px}.feedback{min-height:26px;color:var(--g);font-weight:800}.up{color:var(--up)}.down{color:var(--down)}:focus-visible{outline:3px solid var(--up);outline-offset:3px}@media(max-width:880px){body{padding:12px}.layout{grid-template-columns:1fr}.canvasbox{height:min(58vh,460px)}.panel{max-height:none}}@media(max-width:430px){.canvasbox{height:400px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="shell"><nav class="tabs" role="tablist" aria-label="MACD 学习视图"><button class="tab" role="tab" id="t-components" aria-controls="p-components" aria-selected="true" data-tab="components">组成</button><button class="tab" role="tab" id="t-params" aria-controls="p-params" aria-selected="false" tabindex="-1" data-tab="params">参数</button><button class="tab" role="tab" id="t-signals" aria-controls="p-signals" aria-selected="false" tabindex="-1" data-tab="signals">信号</button><button class="tab" role="tab" id="t-limits" aria-controls="p-limits" aria-selected="false" tabindex="-1" data-tab="limits">局限</button></nav><div class="layout"><section class="stage" aria-label="价格与 MACD 图表"><div class="canvasbox" id="canvasbox"><canvas id="chart" role="img" aria-describedby="summary" tabindex="0"></canvas></div><div class="legend"><span><i class="sw" style="background:var(--up)"></i>价格</span><span><i class="sw" style="background:var(--dif)"></i>DIF</span><span><i class="sw" style="background:var(--dea)"></i>DEA</span><span><i class="sw" style="height:10px;background:var(--g)"></i>MACD 柱</span></div></section><aside class="panel">
<div id="p-components" role="tabpanel" aria-labelledby="t-components"><h2>三组图形，一条计算链</h2><p>MACD 把收盘价平滑成两条 EMA，再比较它们的距离。图中上下两区使用不同刻度，不能直接比较高度。</p><div class="formula">DIF = EMA(快) − EMA(慢)<br>DEA = EMA(DIF, 信号周期)<br>MACD 柱 = 2 × (DIF − DEA)</div><div class="row"><button class="btn" data-line="dif" aria-pressed="true">DIF</button><button class="btn" data-line="dea" aria-pressed="true">DEA</button><button class="btn" data-line="hist" aria-pressed="true">柱体</button></div><p class="insight">DIF 与 DEA 的聚合、分离描述趋势变化；它们由历史价格计算，因此天然滞后。</p></div>
<div id="p-params" role="tabpanel" aria-labelledby="t-params" hidden><h2>参数改变灵敏度</h2><div class="controls"><div class="control"><label for="fast"><span>快线周期</span><output id="fastO">12</output></label><input id="fast" type="range" min="3" max="20" value="12"></div><div class="control"><label for="slow"><span>慢线周期</span><output id="slowO">26</output></label><input id="slow" type="range" min="8" max="40" value="26"></div><div class="control"><label for="signal"><span>信号周期</span><output id="signalO">9</output></label><input id="signal" type="range" min="3" max="15" value="9"></div></div><p class="insight" id="paramInsight" aria-live="polite"></p><div class="row"><button class="btn" id="drawMode" aria-pressed="false">在价格区绘制走势</button><button class="btn" id="clearDraw">恢复示例</button><button class="btn" id="resetParams">重置参数</button></div></div>
<div id="p-signals" role="tabpanel" aria-labelledby="t-signals" hidden><h2>交叉是事件，不是指令</h2><div class="control"><label for="scenario">固定案例</label><select id="scenario"><option value="trend">趋势：交叉后延续</option><option value="range">震荡：交叉频繁失效</option><option value="diverge">背离：动能减弱示意</option></select></div><div class="row"><button class="btn primary" id="play">播放回放</button><button class="btn" id="prev">← 上一步</button><button class="btn" id="next">下一步 →</button><button class="btn" id="resetPlay">重置</button></div><div class="progress" aria-hidden="true"><i id="fill"></i></div><p class="insight" id="signalInsight" aria-live="polite"></p></div>
<div id="p-limits" role="tabpanel" aria-labelledby="t-limits" hidden><h2>指标没有告诉你的事</h2><p class="insight warning">MACD 只使用历史价格。它不知道公司价值、突发信息、流动性、交易成本或你的风险承受能力。</p><div class="quiz"><strong>判断：金叉出现，最准确的表述是？</strong><div class="row"><button class="btn" data-q="buy">买入指令</button><button class="btn" data-q="clue">趋势变化的待验证线索</button></div><div class="feedback" id="feedback" aria-live="polite"></div></div><button class="btn" id="compare">切换趋势/震荡反例</button></div><div class="summary" id="summary"></div></aside></div></main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],c=$('#chart'),ctx=c.getContext('2d');let tab='components',caseName='trend',limit=60,timer=null,drawing=false,custom=null,show={dif:true,dea:true,hist:true};const series={trend:[50,49,48,47,46,46,47,48,49,51,53,55,56,58,59,61,62,63,65,66,67,69,68,70,72,73,74,76,75,78,80,82,81,83,85,86,88,89,90,92,91,93,95,94,96,98,99,101,100,103,105,104,107,109,108,111,113,112,115,118],range:[50,52,49,53,48,52,47,51,49,54,50,53,48,52,47,51,49,53,50,54,49,52,48,51,47,52,49,53,50,54,48,51,47,52,49,53,48,52,50,54,49,51,47,52,48,53,49,54,50,52,48,51,47,53,49,52,48,54,50,51],diverge:[70,68,66,64,62,60,58,56,57,55,53,51,49,47,48,46,44,42,43,41,39,38,40,39,37,36,38,37,35,34,36,35,33,32,34,33,31,30,32,31,29,28,30,29,27,28,29,30,31,33,34,36,38,40,42,45,47,50,53,56]};
function ema(a,n){const k=2/(n+1),out=[a[0]];for(let i=1;i<a.length;i++)out[i]=a[i]*k+out[i-1]*(1-k);return out}function macd(a){const f=+fast.value,s=+slow.value,n=+signal.value,ef=ema(a,f),es=ema(a,s),dif=ef.map((v,i)=>v-es[i]),dea=ema(dif,n),hist=dif.map((v,i)=>2*(v-dea[i]));return{dif,dea,hist}}
function current(){return custom||series[caseName]}function fit(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}
function line(a,color,px,py,n){ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();a.slice(0,n).forEach((v,i)=>i?ctx.lineTo(px(i),py(v)):ctx.moveTo(px(i),py(v)));ctx.stroke()}
function draw(){const w=c.clientWidth,h=c.clientHeight,all=current(),n=Math.min(limit,all.length),a=all.slice(0,n),m=macd(all),left=45,right=20,top=25,priceBottom=h*.48,macdTop=h*.59,bottom=h-28,px=i=>left+i*(w-left-right)/(all.length-1),min=Math.min(...all)-3,max=Math.max(...all)+3,py=v=>top+(max-v)/(max-min)*(priceBottom-top),vals=[...m.dif,...m.dea,...m.hist],mm=Math.max(.1,...vals.map(Math.abs)),my=v=>macdTop+(mm-v)/(2*mm)*(bottom-macdTop);ctx.clearRect(0,0,w,h);ctx.fillStyle='#faf8f5';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#c4a77d44';for(let i=0;i<5;i++){let y=top+i*(priceBottom-top)/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke()}ctx.strokeStyle='#c4a77d';ctx.beginPath();ctx.moveTo(left,my(0));ctx.lineTo(w-right,my(0));ctx.stroke();line(a,'#a65d4e',px,py,n);if(show.hist)m.hist.slice(0,n).forEach((v,i)=>{const bw=Math.max(2,(w-left-right)/all.length*.6),y=my(v),z=my(0);ctx.fillStyle=v>=0?'#a65d4e99':'#4f786599';ctx.fillRect(px(i)-bw/2,Math.min(y,z),bw,Math.max(1,Math.abs(z-y)))});if(show.dif)line(m.dif,'#4f8888',px,my,n);if(show.dea)line(m.dea,'#9b7958',px,my,n);if(tab==='signals'){ctx.strokeStyle='#3d322988';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(px(n-1),top);ctx.lineTo(px(n-1),bottom);ctx.stroke();ctx.setLineDash([])}updateSummary(m,a,n)}
function updateSummary(m,a,n){const last=n-1,dir=a[last]>=a[0]?'总体抬高':'总体降低',hist=m.hist[last],cross=last>0&&((m.dif[last]>=m.dea[last]&&m.dif[last-1]<m.dea[last-1])||(m.dif[last]<=m.dea[last]&&m.dif[last-1]>m.dea[last-1]));summary.textContent=`文本摘要：显示 ${n} 个数据点，价格${dir}；当前 DIF ${m.dif[last].toFixed(2)}，DEA ${m.dea[last].toFixed(2)}，柱体 ${hist.toFixed(2)}${cross?'，本步发生交叉':''}。`;if(tab==='signals')signalInsight.textContent=`第 ${n}/${current().length} 步：${cross?'DIF 与 DEA 本步交叉；':'本步没有新交叉；'}当前柱体${hist>=0?'在零轴上方':'在零轴下方'}。观察它之后发生什么，不把它直接翻译为买卖指令。`;fill.style.width=(n/current().length*100)+'%'}
function constrain(changed){let f=+fast.value,s=+slow.value;if(f>=s){if(changed==='fast')slow.value=Math.min(40,f+1);else fast.value=Math.max(3,s-1)}fastO.value=fast.value;slowO.value=slow.value;signalO.value=signal.value;paramInsight.textContent=`当前 ${fast.value}/${slow.value}/${signal.value}。周期越短通常越灵敏，也更容易在震荡中频繁变化；快线始终小于慢线。`;draw()}
$$('.tab').forEach((b,i)=>{b.onclick=()=>switchTab(b.dataset.tab);b.onkeydown=e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const a=$$('.tab'),n=(i+(e.key==='ArrowRight'?1:-1)+a.length)%a.length;a[n].focus();a[n].click()}});function switchTab(v){tab=v;stop();$$('.tab').forEach(b=>{const on=b.dataset.tab===v;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;$(`#p-${b.dataset.tab}`).hidden=!on});limit=v==='signals'?1:current().length;draw()}
$$('[data-line]').forEach(b=>b.onclick=()=>{const k=b.dataset.line;show[k]=!show[k];b.setAttribute('aria-pressed',show[k]);draw()});fast.oninput=()=>constrain('fast');slow.oninput=()=>constrain('slow');signal.oninput=()=>constrain('signal');resetParams.onclick=()=>{fast.value=12;slow.value=26;signal.value=9;custom=null;constrain()};scenario.onchange=()=>{caseName=scenario.value;custom=null;limit=1;draw()};function step(n){limit=Math.max(1,Math.min(current().length,limit+n));draw()}prev.onclick=()=>step(-1);next.onclick=()=>step(1);function stop(){clearInterval(timer);timer=null;play.textContent='播放回放'}play.onclick=()=>{if(timer){stop();return}if(limit>=current().length)limit=1;play.textContent='暂停';timer=setInterval(()=>{if(limit>=current().length)stop();else step(1)},180)};resetPlay.onclick=()=>{stop();limit=1;draw()};$$('[data-q]').forEach(b=>b.onclick=()=>feedback.textContent=b.dataset.q==='clue'?'正确：交叉需要结合趋势、量价和风险继续验证。':'再想想：指标来自历史价格，不知道未来。');compare.onclick=()=>{caseName=caseName==='range'?'trend':'range';scenario.value=caseName;limit=current().length;draw()};
drawMode.onclick=()=>{drawing=!drawing;drawMode.setAttribute('aria-pressed',drawing);drawMode.textContent=drawing?'正在绘制：拖动价格区':'在价格区绘制走势'};clearDraw.onclick=()=>{custom=null;draw()};let pts=[];canvasbox.onpointerdown=e=>{if(!drawing||tab!=='params')return;pts=[];canvasbox.setPointerCapture(e.pointerId);capture(e)};canvasbox.onpointermove=e=>{if(!canvasbox.hasPointerCapture(e.pointerId))return;capture(e)};canvasbox.onpointerup=e=>{if(!pts.length)return;canvasbox.releasePointerCapture(e.pointerId);const count=60,out=[];for(let i=0;i<count;i++){const target=i/(count-1)*c.clientWidth,near=pts.reduce((a,b)=>Math.abs(b.x-target)<Math.abs(a.x-target)?b:a);out.push(30+(1-near.y/(c.clientHeight*.48))*90)}custom=out;draw()};function capture(e){const r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:Math.max(0,Math.min(r.height*.48,e.clientY-r.top))};pts.push(p);custom=pts.map(q=>30+(1-q.y/(r.height*.48))*90);if(custom.length>2)draw()}
c.onkeydown=e=>{if(tab!=='signals')return;if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}if(e.key==='ArrowRight'){e.preventDefault();step(1)}};new ResizeObserver(fit).observe(c);constrain();
</script></body></html>
