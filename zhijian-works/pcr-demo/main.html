<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCR DNA 扩增动态演示</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #4A6741;
      --color-primary-dark: #3A5334;
      --color-primary-light: #6B8E63;
      --color-secondary: #A0522D;
      --color-accent: #8B7355;
      --color-earth: #C4A77D;
      --color-cream: #FAF8F5;
      --color-cream-dark: #F5F2ED;
      --color-text: #3D3229;
      --color-text-light: #6B5D4D;
      --color-text-muted: #766958;
      --color-sky: #5B8A8A;
      --color-sky-dark: #4A7575;
      --color-lavender: #c2a2d2;
      --color-moss: #6B8E6B;
      --color-rust: #B8765A;
      --color-success: #5B8C5A;
      --color-warning: #C9844A;
      --color-danger: #A65D4E;
      --font-family: 'Noto Serif SC', 'Noto Serif', serif;
      --font-weight-regular: 400;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;
      --font-weight-bold: 800;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-2xl: 48px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 8px rgba(61, 50, 41, 0.08);
      --shadow-md: 0 4px 16px rgba(61, 50, 41, 0.12);
      --shadow-lg: 0 8px 32px rgba(61, 50, 41, 0.16);
      --transition-fast: 0.15s ease-out;
      --transition-normal: 0.3s ease-out;
      --transition-slow: 0.5s ease-out;
      --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-family);
      font-weight: var(--font-weight-regular);
      color: var(--color-text);
      background:
        radial-gradient(circle at 16% 10%, rgba(196, 167, 125, 0.2), transparent 28rem),
        linear-gradient(180deg, var(--color-cream) 0%, var(--color-cream-dark) 100%);
      padding: var(--spacing-lg);
    }

    button, input {
      font: inherit;
    }

    .demo-shell {
      width: min(1080px, 100%);
      margin: 0 auto;
      display: grid;
      gap: var(--spacing-lg);
    }

    .demo-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: var(--spacing-lg);
      align-items: stretch;
    }

    .stage-card,
    .info-card {
      background: white;
      border: 1px solid var(--color-cream-dark);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }

    .stage-card {
      overflow: hidden;
    }

    .canvas-wrap {
      width: 100%;
      aspect-ratio: 16 / 10;
      min-height: 360px;
      background:
        linear-gradient(135deg, rgba(74, 103, 65, 0.08), transparent 45%),
        var(--color-cream);
      position: relative;
    }

    #demoCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .stage-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-md);
      padding: var(--spacing-md);
      border-top: 1px solid var(--color-cream-dark);
    }

    .metric {
      display: grid;
      gap: 2px;
    }

    .metric span {
      color: var(--color-text-muted);
      font-size: 0.78rem;
      font-weight: var(--font-weight-semibold);
    }

    .metric strong {
      color: var(--color-primary-dark);
      font-size: 1.2rem;
    }

    .info-card {
      padding: var(--spacing-lg);
      display: grid;
      align-content: start;
      gap: var(--spacing-md);
    }

    .info-card h2 {
      color: var(--color-primary-dark);
      font-size: 1.25rem;
    }

    .info-card p {
      color: var(--color-text-light);
      line-height: 1.7;
    }

    .phase-badge {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 14px;
      border-radius: var(--radius-full);
      font-size: 0.9rem;
      font-weight: var(--font-weight-bold);
      transition: all var(--transition-normal);
    }

    .phase-badge.idle {
      background: var(--color-cream-dark);
      color: var(--color-text-muted);
    }

    .phase-badge.denaturation {
      background: rgba(166, 93, 78, 0.15);
      color: var(--color-danger);
    }

    .phase-badge.annealing {
      background: rgba(201, 132, 74, 0.15);
      color: var(--color-warning);
    }

    .phase-badge.extension {
      background: rgba(91, 140, 90, 0.15);
      color: var(--color-success);
    }

    .phase-badge.complete {
      background: rgba(74, 103, 65, 0.15);
      color: var(--color-primary-dark);
    }

    .config-group {
      display: grid;
      gap: var(--spacing-sm);
    }

    .config-label {
      color: var(--color-text-muted);
      font-size: 0.85rem;
      font-weight: var(--font-weight-semibold);
    }

    .config-input {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }

    .config-input input {
      width: 80px;
      padding: 8px 12px;
      border: 1px solid var(--color-earth);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      text-align: center;
      transition: border-color var(--transition-fast);
    }

    .config-input input:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .config-input span {
      color: var(--color-text-light);
      font-size: 0.9rem;
    }

    .controls {
      display: grid;
      gap: var(--spacing-sm);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: var(--font-weight-bold);
      transition: transform var(--transition-fast), background var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: var(--color-primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--color-primary-dark);
    }

    .btn-secondary {
      background: var(--color-cream);
      border-color: var(--color-earth);
      color: var(--color-text);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--color-cream-dark);
    }

    @media (max-width: 820px) {
      body {
        padding: var(--spacing-md);
      }

      .demo-layout {
        grid-template-columns: 1fr;
      }

      .canvas-wrap {
        min-height: 260px;
      }
    }
  </style>
</head>
<body>
  <main class="demo-shell">
    <section class="demo-layout" aria-label="交互演示区域">
      <article class="stage-card">
        <div class="canvas-wrap">
          <canvas id="demoCanvas"></canvas>
        </div>
        <div class="stage-caption">
          <div class="metric">
            <span>当前阶段</span>
            <strong id="phaseText">待开始</strong>
          </div>
          <div class="metric">
            <span>循环进度</span>
            <strong id="cycleText">0 / 10</strong>
          </div>
          <div class="metric">
            <span>DNA 拷贝数</span>
            <strong id="copyText">1</strong>
          </div>
        </div>
      </article>

      <aside class="info-card">
        <h2>演示说明</h2>
        <span class="phase-badge idle" id="phaseBadge">准备开始</span>
        <p id="descriptionText">PCR 是一种 DNA 扩增技术。点击"开始"观察每个循环的三个步骤：变性、退火、延伸。</p>

        <div class="config-group">
          <label class="config-label">循环次数设置</label>
          <div class="config-input">
            <input type="number" id="cycleInput" value="10" min="1" max="30" step="1">
            <span>次循环（1-30）</span>
          </div>
        </div>

        <div class="controls">
          <button class="btn btn-primary" id="startBtn" type="button">开始</button>
          <button class="btn btn-secondary" id="pauseBtn" type="button" disabled>暂停</button>
          <button class="btn btn-secondary" id="resetBtn" type="button">重置</button>
        </div>
      </aside>
    </section>
  </main>

  <script>
    // === State Management ===
    const state = {
      currentCycle: 0,
      maxCycles: 10,
      currentPhase: 'IDLE',
      currentTemp: 25,
      dnaCopies: 1,
      isRunning: false,
      isPaused: false,
      animationProgress: 0,
      phaseStartTime: 0,
      phaseTimings: {
        denaturation: 12000,
        annealing: 8000,
        extension: 15000,
        cyclePause: 2000
      },
      targetTemp: 25
    };

    // === Phase Descriptions ===
    const phaseDescriptions = {
      IDLE: {
        badge: '准备开始',
        badgeClass: 'idle',
        text: 'PCR 是一种 DNA 扩增技术。点击"开始"观察每个循环的三个步骤：变性、退火、延伸。'
      },
      DENATURATION: {
        badge: '变性 95°C',
        badgeClass: 'denaturation',
        text: '高温使 DNA 双链的氢键断裂，双螺旋解旋成为两条单链模板。这是扩增的前提条件。'
      },
      ANNEALING: {
        badge: '退火 55°C',
        badgeClass: 'annealing',
        text: '温度降低，引物与单链 DNA 的互补序列结合。引物为新链合成提供起点。'
      },
      EXTENSION: {
        badge: '延伸 72°C',
        badgeClass: 'extension',
        text: 'DNA 聚合酶从引物开始，沿模板链合成新的互补链。每个循环 DNA 数量翻倍。'
      },
      COMPLETE: {
        badge: '扩增完成',
        badgeClass: 'complete',
        text: `经过 ${state.maxCycles} 个循环，初始 DNA 已扩增至 ${Math.pow(2, state.maxCycles)} 份拷贝。`
      }
    };

    // === Canvas Setup ===
    const canvas = document.getElementById('demoCanvas');
    const ctx = canvas.getContext('2d');
    window.window.canvasWidth = 0;
    window.window.canvasHeight = 0;

    function fitCanvas() {
      const rect = canvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) {
        return;
      }
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      window.window.canvasWidth = rect.width;
      window.window.canvasHeight = rect.height;
      draw();
    }

    // === Drawing Functions ===
    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function easeOutQuart(t) {
      return 1 - Math.pow(1 - t, 4);
    }

    function clearCanvas() {
      ctx.fillStyle = '#FAF8F5';
      ctx.fillRect(0, 0, window.window.canvasWidth, window.window.canvasHeight);
    }

    function drawTemperatureBar(temp) {
      const barX = 15;
      const barY = 30;
      const barWidth = 25;
      const barHeight = window.canvasHeight - 60;
      const maxTemp = 100;

      // Background - use regular rect if roundRect not supported
      ctx.fillStyle = 'rgba(245, 242, 237, 0.9)';
      ctx.strokeStyle = '#C4A77D';
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(barX, barY, barWidth, barHeight, 6);
      } else {
        ctx.rect(barX, barY, barWidth, barHeight);
      }
      ctx.fill();
      ctx.stroke();

      // Temperature zones gradient
      const zoneGradient = ctx.createLinearGradient(barX, barY + barHeight, barX, barY);
      zoneGradient.addColorStop(0, '#6B8E63');
      zoneGradient.addColorStop(0.28, '#5B8C5A');
      zoneGradient.addColorStop(0.35, '#C9844A');
      zoneGradient.addColorStop(0.55, '#E8A84C');
      zoneGradient.addColorStop(0.95, '#E85D4C');
      zoneGradient.addColorStop(1, '#A65D4E');

      const fillHeight = (temp / maxTemp) * barHeight;
      ctx.fillStyle = zoneGradient;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(barX + 3, barY + barHeight - fillHeight + 3, barWidth - 6, fillHeight - 6, 4);
      } else {
        ctx.rect(barX + 3, barY + barHeight - fillHeight + 3, barWidth - 6, fillHeight - 6);
      }
      ctx.fill();

      // Temperature label
      ctx.fillStyle = '#3D3229';
      ctx.font = 'bold 13px "Noto Serif SC"';
      ctx.textAlign = 'left';
      ctx.fillText(`${Math.round(temp)}°C`, barX + barWidth + 8, barY + barHeight - fillHeight + 6);

      // Zone labels
      ctx.font = '10px "Noto Serif SC"';
      ctx.fillStyle = '#766958';
      ctx.textAlign = 'left';
      ctx.fillText('95°', barX + barWidth + 8, barY + 15);
      ctx.fillText('55°', barX + barWidth + 8, barY + barHeight * 0.35 + 5);
      ctx.fillText('72°', barX + barWidth + 8, barY + barHeight * 0.28 + 5);
    }

    function drawDoubleHelix(centerX, centerY, width, progress, basePairOpacity, separation) {
      const amplitude = 18;
      const frequency = 6;
      const basePairCount = 12;
      const strandWidth = 4;

      // Calculate positions for two strands
      const offsetX = separation * window.canvasWidth * 0.35;
      const strand1X = centerX - offsetX;
      const strand2X = centerX + offsetX;

      // Draw backbone strand A (moss green)
      ctx.beginPath();
      ctx.strokeStyle = '#4A6741';
      ctx.lineWidth = strandWidth;
      ctx.lineCap = 'round';
      for (let x = 0; x <= width; x += 3) {
        const phase = (x / width) * frequency * Math.PI * 2;
        const waveY = Math.sin(phase + progress * 0.5) * amplitude;
        const px = strand1X - width / 2 + x;
        if (x === 0) ctx.moveTo(px, centerY + waveY);
        else ctx.lineTo(px, centerY + waveY);
      }
      ctx.stroke();

      // Draw backbone strand B (sienna)
      ctx.beginPath();
      ctx.strokeStyle = '#A0522D';
      ctx.lineWidth = strandWidth;
      for (let x = 0; x <= width; x += 3) {
        const phase = (x / width) * frequency * Math.PI * 2;
        const waveY = Math.sin(phase + Math.PI + progress * 0.5) * amplitude;
        const px = strand2X - width / 2 + x;
        if (x === 0) ctx.moveTo(px, centerY + waveY);
        else ctx.lineTo(px, centerY + waveY);
      }
      ctx.stroke();

      // Draw base pairs (connecting lines) with opacity
      if (separation < 0.5 && basePairOpacity > 0) {
        for (let i = 0; i <= basePairCount; i++) {
          const xRatio = i / basePairCount;
          const x1 = strand1X - width / 2 + width * xRatio;
          const x2 = strand2X - width / 2 + width * xRatio;
          const phase1 = (xRatio) * frequency * Math.PI * 2 + progress * 0.5;
          const phase2 = phase1 + Math.PI;
          const y1 = centerY + Math.sin(phase1) * amplitude;
          const y2 = centerY + Math.sin(phase2) * amplitude;

          ctx.beginPath();
          ctx.strokeStyle = `rgba(139, 115, 85, ${basePairOpacity * 0.8})`;
          ctx.lineWidth = 2;
          ctx.moveTo(x1, y1);
          ctx.lineTo((x1 + x2) / 2, centerY);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
      }
    }

    function drawPrimer(strandX, strandY, bound, primerLength) {
      ctx.strokeStyle = '#B8765A';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(strandX, strandY);
      ctx.lineTo(strandX + primerLength, strandY);
      ctx.stroke();

      if (bound) {
        ctx.fillStyle = 'rgba(184, 118, 90, 0.25)';
        ctx.beginPath();
        ctx.arc(strandX + primerLength / 2, strandY, 10, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPolymerase(x, y) {
      ctx.fillStyle = '#5B8A8A';
      ctx.strokeStyle = '#4A7575';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Label
      ctx.fillStyle = '#3D3229';
      ctx.font = '9px "Noto Serif SC"';
      ctx.textAlign = 'center';
      ctx.fillText('酶', x, y + 4);
    }

    function drawGrowingStrand(startX, endX, y, color) {
      if (endX <= startX) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(startX, y);
      ctx.lineTo(endX, y);
      ctx.stroke();
    }

    function drawPhaseLabel(phase, centerX, y) {
      const labels = {
        DENATURATION: '变性阶段',
        ANNEALING: '退火阶段',
        EXTENSION: '延伸阶段',
        IDLE: '',
        COMPLETE: ''
      };

      const label = labels[phase];
      if (!label) return;

      ctx.fillStyle = 'rgba(61, 50, 41, 0.8)';
      ctx.font = 'bold 16px "Noto Serif SC"';
      ctx.textAlign = 'center';
      ctx.fillText(label, centerX, y);
    }

    // === Main Draw Function ===
    function draw() {
      if (!window.canvasWidth || !window.canvasHeight) return;
      clearCanvas();
      drawTemperatureBar(state.currentTemp);

      const centerX = window.canvasWidth * 0.55;
      const centerY = window.canvasHeight * 0.5;
      const helixWidth = Math.min(window.canvasWidth * 0.5, 280);

      // Phase-specific visualization
      switch (state.currentPhase) {
        case 'IDLE':
          drawDoubleHelix(centerX, centerY, helixWidth, 0, 1, 0);
          break;

        case 'DENATURATION': {
          const denProgress = easeOutQuart(state.animationProgress);
          const basePairOpacity = 1 - denProgress;
          const separation = denProgress;
          drawDoubleHelix(centerX, centerY, helixWidth, denProgress * 2, basePairOpacity, separation);
          drawPhaseLabel('DENATURATION', centerX, window.canvasHeight * 0.85);
          break;
        }

        case 'ANNEALING': {
          const annealProgress = easeOutQuart(state.animationProgress);
          const annealSeparation = 0.5;
          drawDoubleHelix(centerX, centerY, helixWidth, annealProgress * 3, 0, annealSeparation);

          // Draw primers
          const strand1X = centerX - annealSeparation * window.canvasWidth * 0.35;
          const strand2X = centerX + annealSeparation * window.canvasWidth * 0.35;
          const primerLength = 25;
          const primerBound = annealProgress > 0.5;

          drawPrimer(strand1X - helixWidth / 2, centerY + 18, primerBound, primerLength);
          drawPrimer(strand2X - helixWidth / 2, centerY - 18, primerBound, primerLength);
          drawPhaseLabel('ANNEALING', centerX, window.canvasHeight * 0.85);
          break;
        }

        case 'EXTENSION': {
          const extProgress = easeOutQuart(state.animationProgress);
          const extSeparation = 0.5;

          // Draw template strands
          drawDoubleHelix(centerX, centerY, helixWidth, extProgress * 4, 0, extSeparation);

          const strand1X = centerX - extSeparation * window.canvasWidth * 0.35;
          const strand2X = centerX + extSeparation * window.canvasWidth * 0.35;
          const primerLength = 25;

          // Draw primers
          drawPrimer(strand1X - helixWidth / 2, centerY + 18, true, primerLength);
          drawPrimer(strand2X - helixWidth / 2, centerY - 18, true, primerLength);

          // Draw polymerase and growing strands
          const strandStart = strand1X - helixWidth / 2 + primerLength;
          const strandEnd = strandStart + extProgress * helixWidth * 0.7;

          drawGrowingStrand(strandStart, strandEnd, centerY + 18, '#4A6741');
          drawGrowingStrand(strand2X - helixWidth / 2 + primerLength, strand2X - helixWidth / 2 + primerLength + extProgress * helixWidth * 0.7, centerY - 18, '#A052D');

          if (extProgress < 0.95) {
            drawPolymerase(strandEnd, centerY + 18);
            drawPolymerase(strand2X - helixWidth / 2 + primerLength + extProgress * helixWidth * 0.7, centerY - 18);
          }

          drawPhaseLabel('EXTENSION', centerX, window.canvasHeight * 0.85);
          break;
        }

        case 'COMPLETE': {
          // Draw multiple helices to show amplification
          for (let i = 0; i < Math.min(4, state.dnaCopies); i++) {
            const offsetX = (i % 2) * 80 - 40;
            const offsetY = Math.floor(i / 2) * 60;
            drawDoubleHelix(centerX + offsetX, centerY + offsetY - 30, helixWidth * 0.6, i * 0.5, 1, 0);
          }
          break;
        }
      }
    }

    // === Animation Loop ===
    let frameId = null;

    function updateUI() {
      document.getElementById('phaseText').textContent = getPhaseText();
      document.getElementById('cycleText').textContent = `${state.currentCycle} / ${state.maxCycles}`;
      document.getElementById('copyText').textContent = state.dnaCopies;

      const badge = document.getElementById('phaseBadge');
      const desc = phaseDescriptions[state.currentPhase];
      badge.textContent = desc.badge;
      badge.className = `phase-badge ${desc.badgeClass}`;
      document.getElementById('descriptionText').textContent = desc.text;
    }

    function getPhaseText() {
      const texts = {
        IDLE: '待开始',
        DENATURATION: '变性',
        ANNEALING: '退火',
        EXTENSION: '延伸',
        COMPLETE: '完成'
      };
      return texts[state.currentPhase];
    }

    function transitionToPhase(newPhase) {
      state.currentPhase = newPhase;
      state.animationProgress = 0;
      state.phaseStartTime = performance.now();

      switch (newPhase) {
        case 'DENATURATION':
          state.targetTemp = 95;
          break;
        case 'ANNEALING':
          state.targetTemp = 55;
          break;
        case 'EXTENSION':
          state.targetTemp = 72;
          break;
        case 'CYCLE_COMPLETE':
          state.currentCycle++;
          state.dnaCopies = Math.pow(2, state.currentCycle);
          updateUI();
          break;
      }
    }

    function handlePhaseComplete() {
      switch (state.currentPhase) {
        case 'DENATURATION':
          transitionToPhase('ANNEALING');
          break;
        case 'ANNEALING':
          transitionToPhase('EXTENSION');
          break;
        case 'EXTENSION':
          state.currentCycle++;
          state.dnaCopies = Math.pow(2, state.currentCycle);
          updateUI();
          if (state.currentCycle >= state.maxCycles) {
            state.currentPhase = 'COMPLETE';
            state.isRunning = false;
            updateUI();
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
          } else {
            state.currentPhase = 'DENATURATION';
            state.animationProgress = 0;
            state.phaseStartTime = performance.now();
            state.targetTemp = 95;
            updateUI();
          }
          break;
      }
    }

    function mainLoop(timestamp) {
      if (!state.isRunning || state.isPaused) {
        return;
      }

      // Update temperature
      state.currentTemp = lerp(state.currentTemp, state.targetTemp, 0.05);

      // Calculate phase progress
      const phaseDuration = state.phaseTimings[state.currentPhase.toLowerCase()] || 12000;
      const elapsed = timestamp - state.phaseStartTime;
      state.animationProgress = Math.min(1, elapsed / phaseDuration);

      draw();
      updateUI();

      if (state.animationProgress >= 1) {
        handlePhaseComplete();
      }

      frameId = requestAnimationFrame(mainLoop);
    }

    // === Event Handlers ===
    document.getElementById('startBtn').addEventListener('click', () => {
      if (state.isRunning) return;

      state.maxCycles = parseInt(document.getElementById('cycleInput').value) || 10;
      state.maxCycles = Math.max(1, Math.min(30, state.maxCycles));

      if (state.currentPhase === 'COMPLETE' || state.currentPhase === 'IDLE') {
        state.currentCycle = 0;
        state.dnaCopies = 1;
        state.currentTemp = 25;
        state.currentPhase = 'DENATURATION';
        state.targetTemp = 95;
      }

      state.isRunning = true;
      state.isPaused = false;
      state.phaseStartTime = performance.now();
      state.animationProgress = 0;

      updateUI();
      document.getElementById('startBtn').disabled = true;
      document.getElementById('pauseBtn').disabled = false;
      document.getElementById('cycleInput').disabled = true;

      frameId = requestAnimationFrame(mainLoop);
    });

    document.getElementById('pauseBtn').addEventListener('click', () => {
      state.isPaused = !state.isPaused;
      document.getElementById('pauseBtn').textContent = state.isPaused ? '继续' : '暂停';
      if (!state.isPaused) {
        state.phaseStartTime = performance.now() - state.animationProgress * state.phaseTimings[state.currentPhase.toLowerCase()];
        frameId = requestAnimationFrame(mainLoop);
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      state.isRunning = false;
      state.isPaused = false;
      state.currentCycle = 0;
      state.dnaCopies = 1;
      state.currentTemp = 25;
      state.currentPhase = 'IDLE';
      state.targetTemp = 25;
      state.animationProgress = 0;

      cancelAnimationFrame(frameId);
      updateUI();
      draw();

      document.getElementById('startBtn').disabled = false;
      document.getElementById('pauseBtn').disabled = true;
      document.getElementById('pauseBtn').textContent = '暂停';
      document.getElementById('cycleInput').disabled = false;
    });

    document.getElementById('cycleInput').addEventListener('change', (e) => {
      let value = parseInt(e.target.value) || 10;
      value = Math.max(1, Math.min(30, value));
      e.target.value = value;
      state.maxCycles = value;
      document.getElementById('cycleText').textContent = `${state.currentCycle} / ${value}`;
    });

    // === Initialization ===
    function init() {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          fitCanvas();
          updateUI();
        });
      });
    }
    window.addEventListener('resize', fitCanvas);
    window.addEventListener('load', init);
    init();
  </script>
</body>
</html>
